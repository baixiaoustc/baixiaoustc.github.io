<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="雪豹头像">
  <!-- 骰子大冒险 · 雪豹头像
       emoji 里没有「雪豹头像」这一款（🐆 是全身像），所以自己画一个，
       和其他三只（🐰🦊🐤）一样只露一个头。只用到 ellipse / circle / polygon / line，
       方便用 docs/adv-avatar-preview.py 离线核对左右对称、留白和「缩到棋子大小还认得出来」。
       眼睛故意画大：棋盘上的棋子只有 30px 左右，眼睛小了就糊成一团。 -->

  <!-- 耳朵（左右镜像，x 关于 50 对称） -->
  <g stroke="#83919f" stroke-width="2.6">
    <polygon points="18,54 13,8 47,28" fill="#ccd6e1"/>
    <polygon points="82,54 87,8 53,28" fill="#ccd6e1"/>
    <polygon points="23,45 19,16 42,29" fill="#f0cdd3" stroke-width="0"/>
    <polygon points="77,45 81,16 58,29" fill="#f0cdd3" stroke-width="0"/>
  </g>

  <!-- 脸 -->
  <ellipse cx="50" cy="58" rx="38" ry="35" fill="#ccd6e1" stroke="#83919f" stroke-width="2.6"/>

  <!-- 玫瑰花斑 -->
  <g fill="#71808f">
    <circle cx="50" cy="30" r="3.4"/>
    <circle cx="35" cy="32" r="2.8"/>
    <circle cx="65" cy="32" r="2.8"/>
    <circle cx="21" cy="50" r="2.6"/>
    <circle cx="79" cy="50" r="2.6"/>
    <circle cx="22" cy="66" r="2.4"/>
    <circle cx="78" cy="66" r="2.4"/>
  </g>

  <!-- 眼睛（浅绿眼珠 + 竖瞳，雪豹的样子） -->
  <g>
    <ellipse cx="34" cy="50" rx="8.5" ry="9.5" fill="#f9fbfd"/>
    <ellipse cx="66" cy="50" rx="8.5" ry="9.5" fill="#f9fbfd"/>
    <ellipse cx="34" cy="50.4" rx="6.6" ry="8" fill="#8fbf7a"/>
    <ellipse cx="66" cy="50.4" rx="6.6" ry="8" fill="#8fbf7a"/>
    <ellipse cx="34" cy="50.4" rx="3.6" ry="6.6" fill="#39424c"/>
    <ellipse cx="66" cy="50.4" rx="3.6" ry="6.6" fill="#39424c"/>
    <circle cx="31.4" cy="45.4" r="2.3" fill="#ffffff"/>
    <circle cx="68.6" cy="45.4" r="2.3" fill="#ffffff"/>
  </g>

  <!-- 口鼻 -->
  <ellipse cx="50" cy="76" rx="19" ry="13" fill="#fbfdff" stroke="#b7c4d2" stroke-width="1.9"/>
  <polygon points="50,67 56,71 44,71" fill="#c2848f"/>
  <g stroke="#9caabb" stroke-width="1.9" stroke-linecap="round">
    <line x1="50" y1="71" x2="50" y2="74.5"/>
    <line x1="50" y1="74.5" x2="45.8" y2="77"/>
    <line x1="50" y1="74.5" x2="54.2" y2="77"/>
    <line x1="35" y1="70" x2="18" y2="68"/>
    <line x1="35" y1="79" x2="19" y2="80"/>
    <line x1="65" y1="70" x2="82" y2="68"/>
    <line x1="65" y1="79" x2="81" y2="80"/>
  </g>
</svg>
