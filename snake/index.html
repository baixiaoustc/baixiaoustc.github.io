<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>白玉如你好 - 贪吃蛇游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: url('e6ca4381-1ac4-4b76-a92e-31f5b9f4b126.jpg') no-repeat center center;
            background-size: cover;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            padding: 20px;
            overflow: hidden;
        }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: -1;
        }
        .welcome-section { text-align: center; color: #fff; margin-bottom: 20px; }
        .welcome-section h1 {
            font-size: 3rem; font-weight: 300; letter-spacing: 0.2em;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }
        .game-container {
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; color: #fff;
        }
        .score-display { font-size: 1.2rem; font-weight: bold; }
        .score-display span { color: #4CAF50; }
        .speed-display { font-size: 1rem; color: #fff; }
        .speed-display span { color: #FFD700; }
        .speed-hint { font-size: 0.8rem; color: #aaa; }
        .game-canvas {
            display: block; background: #1a1a2e;
            border: 2px solid #4CAF50; border-radius: 8px;
        }
        .game-controls {
            margin-top: 15px; text-align: center;
        }
        .btn {
            background: #4CAF50; color: white; border: none;
            padding: 12px 30px; font-size: 1rem;
            border-radius: 25px; cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover { background: #45a049; transform: scale(1.05); }
        .btn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        .instructions {
            margin-top: 15px; color: #aaa; font-size: 0.9rem; text-align: center;
        }
        .instructions strong { color: #4CAF50; }
        .game-over {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 30px; border-radius: 15px;
            text-align: center; color: #fff;
            display: none; border: 2px solid #f44336;
        }
        .game-over h2 { color: #f44336; margin-bottom: 15px; }
        
        /* 触摸控制按钮样式 */
        .touch-controls {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        .d-pad {
            display: inline-grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }
        .d-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 10px;
            background: rgba(76, 175, 80, 0.8);
            color: white;
            font-size: 24px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .d-btn:active {
            background: rgba(76, 175, 80, 1);
            transform: scale(0.95);
        }
        .d-btn.up { grid-column: 2; grid-row: 1; }
        .d-btn.left { grid-column: 1; grid-row: 2; }
        .d-btn.right { grid-column: 3; grid-row: 2; }
        .d-btn.down { grid-column: 2; grid-row: 3; }
        
        .action-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .action-btn {
            width: 100px;
            height: 50px;
            border: none;
            border-radius: 25px;
            background: rgba(33, 150, 243, 0.8);
            color: white;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .action-btn:active {
            background: rgba(33, 150, 243, 1);
            transform: scale(0.95);
        }
        
        .speed-buttons {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .speed-btn {
            padding: 8px 16px;
            border: 2px solid rgba(255, 193, 7, 0.5);
            border-radius: 20px;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .speed-btn.active {
            background: rgba(255, 193, 7, 0.3);
            border-color: rgba(255, 193, 7, 1);
            color: #FFD700;
        }
        .speed-btn:active {
            transform: scale(0.95);
        }
        
        /* 样式选择按钮 */
        .style-controls {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .style-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .style-label {
            color: #aaa;
            font-size: 0.9rem;
            min-width: 60px;
        }
        .style-btn {
            padding: 6px 14px;
            border: 2px solid rgba(76, 175, 80, 0.5);
            border-radius: 15px;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s ease;
        }
        .style-btn.active {
            background: rgba(76, 175, 80, 0.4);
            border-color: rgba(76, 175, 80, 1);
            color: #81c784;
        }
        .style-btn:active {
            transform: scale(0.95);
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .welcome-section h1 { font-size: 2rem; }
            .game-canvas {
                width: 100%;
                max-width: 350px;
                height: auto;
            }
            .game-header {
                flex-direction: column;
                gap: 8px;
            }
            .score-display, .speed-display { font-size: 1rem; }
            .touch-controls { display: block; }
            .instructions { font-size: 0.8rem; }
        }
        
        @media (max-width: 480px) {
            .game-canvas {
                max-width: 300px;
            }
            .d-pad {
                grid-template-columns: repeat(3, 50px);
                grid-template-rows: repeat(3, 50px);
                gap: 3px;
            }
            .d-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
            .action-btn {
                width: 80px;
                height: 40px;
                font-size: 14px;
            }
            .speed-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="welcome-section">
        <h1>白玉如你好</h1>
    </div>
    <div class="game-container">
        <div class="game-header">
            <div class="score-display">得分: <span id="score">0</span></div>
            <div class="speed-display">速度: <span id="speed">中速</span> <span class="speed-hint">(按1/2/3切换)</span></div>
        </div>
        <div style="position: relative; display: inline-block;">
            <canvas id="gameCanvas" class="game-canvas" width="400" height="400"></canvas>
            <div id="gameOver" class="game-over">
                <h2>游戏结束</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <button class="btn" onclick="startGame()" style="margin-top: 15px;">重新开始</button>
            </div>
        </div>
        <div class="game-controls">
            <button class="btn" id="startBtn" onclick="startGame()">开始游戏</button>
        </div>
        <!-- 触摸控制区域 -->
        <div class="touch-controls">
            <div class="d-pad">
                <button class="d-btn up" onclick="handleDirection(0, -1)" ontouchstart="handleDirection(0, -1)">↑</button>
                <button class="d-btn left" onclick="handleDirection(-1, 0)" ontouchstart="handleDirection(-1, 0)">←</button>
                <button class="d-btn right" onclick="handleDirection(1, 0)" ontouchstart="handleDirection(1, 0)">→</button>
                <button class="d-btn down" onclick="handleDirection(0, 1)" ontouchstart="handleDirection(0, 1)">↓</button>
            </div>
            <div class="action-buttons">
                <button class="action-btn" onclick="toggleGame()" ontouchstart="toggleGame()">开始/暂停</button>
            </div>
            <div class="speed-buttons">
                <button class="speed-btn" id="btn-slow" onclick="setSpeed('slow')" ontouchstart="setSpeed('slow')">慢速</button>
                <button class="speed-btn active" id="btn-normal" onclick="setSpeed('normal')" ontouchstart="setSpeed('normal')">中速</button>
                <button class="speed-btn" id="btn-fast" onclick="setSpeed('fast')" ontouchstart="setSpeed('fast')">快速</button>
            </div>
        </div>

        <!-- 样式选择按钮 -->
        <div class="style-controls">
            <div class="style-section">
                <span class="style-label">蛇样式:</span>
                <button class="style-btn" id="snake-style-classic" onclick="setSnakeStyle('classic')" ontouchstart="setSnakeStyle('classic')">经典</button>
                <button class="style-btn active" id="snake-style-cute" onclick="setSnakeStyle('cute')" ontouchstart="setSnakeStyle('cute')">可爱</button>
            </div>
            <div class="style-section">
                <span class="style-label">背景:</span>
                <button class="style-btn active" id="bg-style-photo" onclick="setBgStyle('photo')" ontouchstart="setBgStyle('photo')">照片</button>
                <button class="style-btn" id="bg-style-dark" onclick="setBgStyle('dark')" ontouchstart="setBgStyle('dark')">深色</button>
                <button class="style-btn" id="bg-style-light" onclick="setBgStyle('light')" ontouchstart="setBgStyle('light')">浅色</button>
            </div>
        </div>

        <div class="instructions">
            <p><strong>操作说明：</strong>空格键开始/暂停 | ↑ ↓ ← → 方向键控制移动 | <strong>1/2/3 键切换速度</strong></p>
            <p><strong>Q/W 切换蛇样式</strong> | <strong>A/S/D 切换背景</strong></p>
            <p>手机用户：使用下方的方向按钮控制，点击速度按钮切换速度</p>
            <p>吃掉水果得分，撞到墙壁或自己身体游戏结束</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        const fruits = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍑', '🍒', '🍍', '🥝', '🍉', '🥭', '🍌'];
        let currentFruit = fruits[0];
        
        let snake = [];
        let food = {};
        let dx = 0, dy = 0;
        let score = 0;
        let gameLoop = null;
        let isPaused = false;
        let isGameRunning = false;
        
        // 游戏速度控制
        const speeds = {
            slow: { interval: 150, name: '慢速', key: '1' },
            normal: { interval: 100, name: '中速', key: '2' },
            fast: { interval: 60, name: '快速', key: '3' }
        };
        let currentSpeed = speeds.normal;
        
        function initGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            isPaused = false;
            generateFood();
            updateScore();
        }
        
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            currentFruit = fruits[Math.floor(Math.random() * fruits.length)];
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }
        
        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#2a2a3e';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            // 绘制蛇 - 根据 snakeStyle 选择样式
            if (snakeStyle === 'classic') {
                // 经典样式：简单方形
                snake.forEach((segment, index) => {
                    ctx.fillStyle = index === 0 ? '#66bb6a' : '#4caf50';
                    ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
                });
            } else {
                // 可爱样式：圆形渐变 + 眼睛舌头
                snake.forEach((segment, index) => {
                    const x = segment.x * gridSize;
                    const y = segment.y * gridSize;
                    const isHead = index === 0;
                    const centerX = x + gridSize / 2;
                    const centerY = y + gridSize / 2;
                    
                    // 绘制阴影
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.beginPath();
                    ctx.arc(centerX + 2, centerY + 2, gridSize / 2 - 1, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 创建径向渐变
                    const gradient = ctx.createRadialGradient(
                        centerX - 2, centerY - 2, 1,
                        centerX, centerY, gridSize / 2 - 1
                    );
                    
                    if (isHead) {
                        gradient.addColorStop(0, '#81c784');
                        gradient.addColorStop(0.6, '#66bb6a');
                        gradient.addColorStop(1, '#43a047');
                    } else {
                        const hue = 120 + (index % 5) * 5;
                        gradient.addColorStop(0, `hsl(${hue}, 65%, 55%)`);
                        gradient.addColorStop(0.6, `hsl(${hue}, 60%, 45%)`);
                        gradient.addColorStop(1, `hsl(${hue}, 55%, 35%)`);
                    }
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, gridSize / 2 - 1, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, gridSize / 2 - 2, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.beginPath();
                    ctx.arc(centerX - gridSize/5, centerY - gridSize/5, gridSize/8, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 蛇头绘制眼睛和舌头
                    if (isHead) {
                        drawSnakeEyes(ctx, centerX, centerY, gridSize, dx, dy);
                        drawSnakeTongue(ctx, centerX, centerY, gridSize, dx, dy);
                    }
                });
            }

            ctx.font = '16px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(currentFruit, food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2);
        }
        
        function update() {
            if (isPaused || !isGameRunning) return;
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                generateFood();
            } else {
                snake.pop();
            }
        }
        
        function updateScore() {
            document.getElementById('score').textContent = score;
        }
        
        function gameOver() {
            isGameRunning = false;
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('startBtn').textContent = '开始游戏';
            document.getElementById('startBtn').disabled = false;
        }
        
        function startGame() {
            document.getElementById('gameOver').style.display = 'none';
            initGame();
            isGameRunning = true;
            isPaused = false;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                update();
                draw();
            }, currentSpeed.interval);
            document.getElementById('startBtn').textContent = '游戏中';
            document.getElementById('startBtn').disabled = true;
        }
        
        function pauseGame() {
            if (!isGameRunning) return;
            isPaused = !isPaused;
        }
        
        // 速度控制函数
        function setSpeed(speedKey) {
            if (speeds[speedKey]) {
                currentSpeed = speeds[speedKey];
                document.getElementById('speed').textContent = currentSpeed.name;
                // 更新按钮状态
                updateSpeedButtons(speedKey);
                // 如果游戏正在运行，重新设置定时器以应用新速度
                if (isGameRunning && !isPaused) {
                    clearInterval(gameLoop);
                    gameLoop = setInterval(() => {
                        update();
                        draw();
                    }, currentSpeed.interval);
                }
            }
        }
        
        // 更新速度按钮状态
        function updateSpeedButtons(activeSpeed) {
            const buttons = {
                'slow': document.getElementById('btn-slow'),
                'normal': document.getElementById('btn-normal'),
                'fast': document.getElementById('btn-fast')
            };
            for (let key in buttons) {
                if (buttons[key]) {
                    buttons[key].classList.toggle('active', key === activeSpeed);
                }
            }
        }
        
        // 处理方向按钮点击
        function handleDirection(newDx, newDy) {
            if (!isGameRunning || isPaused) return;
            // 防止反向移动
            if (newDx !== 0 && dx !== 0) return;
            if (newDy !== 0 && dy !== 0) return;
            dx = newDx;
            dy = newDy;
        }
        
        // 切换游戏状态（开始/暂停）
        function toggleGame() {
            if (!isGameRunning) {
                startGame();
            } else {
                pauseGame();
            }
        }

        // 键盘事件监听 - 在脚本末尾添加
        document.onkeydown = function(e) {
            // 阻止所有方向键和空格键的默认行为
            if(e.keyCode >= 37 && e.keyCode <= 40 || e.keyCode === 32) {
                e.preventDefault ? e.preventDefault() : e.returnValue = false;
            }
            
            var code = e.keyCode;
            
            // 数字键 1/2/3 - 切换速度
            if(code === 49) { setSpeed('slow'); return false; }      // 1 - 慢速
            if(code === 50) { setSpeed('normal'); return false; }   // 2 - 中速
            if(code === 51) { setSpeed('fast'); return false; }       // 3 - 快速
            
            // Q/W - 切换蛇样式
            if(code === 81) { setSnakeStyle(snakeStyle === 'cute' ? 'classic' : 'cute'); return false; } // Q - 切换
            if(code === 87) { setSnakeStyle('cute'); return false; } // W - 可爱
            
            // A/S/D - 切换背景
            if(code === 65) { setBgStyle('photo'); return false; } // A - 照片
            if(code === 83) { setBgStyle('dark'); return false; } // S - 深色
            if(code === 68) { setBgStyle('light'); return false; } // D - 浅色
            
            // 空格键 - 开始/暂停
            if(code === 32) {
                if(!isGameRunning) startGame();
                else pauseGame();
                return false;
            }
            
            // 游戏未运行或已暂停，不响应方向键
            if(!isGameRunning || isPaused) return false;
            
            // 方向键控制 (37左, 38上, 39右, 40下)
            if(code === 38 && dy === 0) { dx = 0; dy = -1; }
            else if(code === 40 && dy === 0) { dx = 0; dy = 1; }
            else if(code === 37 && dx === 0) { dx = -1; dy = 0; }
            else if(code === 39 && dx === 0) { dx = 1; dy = 0; }
            
            return false;
        };

        // 蛇样式和背景样式控制
        let snakeStyle = 'cute'; // 'classic' 或 'cute'
        let bgStyle = 'photo'; // 'photo', 'dark', 'light'
        
        function setSnakeStyle(style) {
            if (style === 'classic' || style === 'cute') {
                snakeStyle = style;
                // 更新按钮状态
                document.getElementById('snake-style-classic').classList.toggle('active', style === 'classic');
                document.getElementById('snake-style-cute').classList.toggle('active', style === 'cute');
                // 立即重绘
                if (!isGameRunning) draw();
            }
        }
        
        function setBgStyle(style) {
            if (['photo', 'dark', 'light'].includes(style)) {
                bgStyle = style;
                const body = document.body;
                const overlay = document.querySelector('.overlay');
                const canvas = document.getElementById('gameCanvas');
                
                // 更新按钮状态
                document.getElementById('bg-style-photo').classList.toggle('active', style === 'photo');
                document.getElementById('bg-style-dark').classList.toggle('active', style === 'dark');
                document.getElementById('bg-style-light').classList.toggle('active', style === 'light');
                
                // 应用背景样式
                if (style === 'photo') {
                    body.style.background = "url('e6ca4381-1ac4-4b76-a92e-31f5b9f4b126.jpg') no-repeat center center";
                    body.style.backgroundSize = 'cover';
                    overlay.style.background = 'rgba(0,0,0,0.5)';
                    document.querySelector('.welcome-section h1').style.color = '#fff';
                } else if (style === 'dark') {
                    body.style.background = '#1a1a2e';
                    overlay.style.background = 'transparent';
                    document.querySelector('.welcome-section h1').style.color = '#fff';
                } else if (style === 'light') {
                    body.style.background = '#f5f5f5';
                    overlay.style.background = 'transparent';
                    document.querySelector('.welcome-section h1').style.color = '#333';
                }
            }
        }
        
        // 初始绘制
        draw();
        
        // 蛇眼睛绘制函数（移到外部）
        function drawSnakeEyes(ctx, centerX, centerY, gridSize, dirX, dirY) {
            const eyeRadius = gridSize * 0.18;
            const pupilRadius = gridSize * 0.1;
            const eyeOffset = gridSize * 0.22;
            
            let eye1X, eye1Y, eye2X, eye2Y;
            
            if (dirX === 1) {
                eye1X = centerX + eyeOffset; eye1Y = centerY - eyeOffset;
                eye2X = centerX + eyeOffset; eye2Y = centerY + eyeOffset;
            } else if (dirX === -1) {
                eye1X = centerX - eyeOffset; eye1Y = centerY - eyeOffset;
                eye2X = centerX - eyeOffset; eye2Y = centerY + eyeOffset;
            } else if (dirY === -1) {
                eye1X = centerX - eyeOffset; eye1Y = centerY - eyeOffset;
                eye2X = centerX + eyeOffset; eye2Y = centerY - eyeOffset;
            } else {
                eye1X = centerX - eyeOffset; eye1Y = centerY + eyeOffset;
                eye2X = centerX + eyeOffset; eye2Y = centerY + eyeOffset;
            }
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(eye1X, eye1Y, eyeRadius, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(eye2X, eye2Y, eyeRadius, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath(); ctx.arc(eye1X, eye1Y, pupilRadius, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(eye2X, eye2Y, pupilRadius, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath(); ctx.arc(eye1X - pupilRadius*0.3, eye1Y - pupilRadius*0.3, pupilRadius*0.3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(eye2X - pupilRadius*0.3, eye2Y - pupilRadius*0.3, pupilRadius*0.3, 0, Math.PI * 2); ctx.fill();
        }
        
        // 蛇舌头绘制函数（移到外部）
        function drawSnakeTongue(ctx, centerX, centerY, gridSize, dirX, dirY) {
            const tongueLength = gridSize * 0.35;
            const tongueWidth = 2;
            const forkLength = gridSize * 0.12;
            
            let startX = centerX, startY = centerY;
            let endX = centerX, endY = centerY;
            let angle = 0;
            
            if (dirX === 1) {
                startX = centerX + gridSize/2 - 2; endX = startX + tongueLength;
                angle = 0;
            } else if (dirX === -1) {
                startX = centerX - gridSize/2 + 2; endX = startX - tongueLength;
                angle = Math.PI;
            } else if (dirY === -1) {
                startY = centerY - gridSize/2 + 2; endY = startY - tongueLength;
                angle = -Math.PI/2;
            } else {
                startY = centerY + gridSize/2 - 2; endY = startY + tongueLength;
                angle = Math.PI/2;
            }
            
            ctx.strokeStyle = '#c62828';
            ctx.fillStyle = '#c62828';
            ctx.lineWidth = tongueWidth;
            ctx.lineCap = 'round';
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            
            const leftX = endX + Math.cos(angle - 0.5) * forkLength;
            const leftY = endY + Math.sin(angle - 0.5) * forkLength;
            const rightX = endX + Math.cos(angle + 0.5) * forkLength;
            const rightY = endY + Math.sin(angle + 0.5) * forkLength;
            
            ctx.lineWidth = tongueWidth - 1;
            ctx.beginPath(); ctx.moveTo(endX, endY); ctx.lineTo(leftX, leftY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(endX, endY); ctx.lineTo(rightX, rightY); ctx.stroke();
        }
    </script>
