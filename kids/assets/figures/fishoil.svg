<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="橘红色的小胶囊里是DHA，是大脑和眼睛的建筑材料">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="22" font-weight="700" fill="#2F3542">橘红色的小胶囊里，装的是大脑和眼睛的材料</text>

  <!-- 胶囊 -->
  <g transform="rotate(-28 150 200)">
    <rect x="86" y="176" width="128" height="52" rx="26" fill="#FFA24D" stroke="#E07020" stroke-width="3.5"/>
    <path d="M150 176 v52" stroke="#E07020" stroke-width="3"/>
    <rect x="98" y="186" width="34" height="10" rx="5" fill="#FFFFFF" opacity="0.55"/>
    <ellipse cx="150" cy="202" rx="60" ry="22" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.35"/>
  </g>
  <text x="150" y="272" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#B5623F">鱼油 DHA 胶囊</text>
  <text x="150" y="296" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="14" fill="#6B7280">软软的、亮亮的，不是糖</text>

  <!-- 箭头 -->
  <path d="M236 200 h44" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <path d="M282 200 l-12 -7 v14 z" fill="#CBD5E1"/>

  <!-- 大脑 -->
  <g>
    <circle cx="372" cy="176" r="34" fill="#FFC8DD" stroke="#E86A92" stroke-width="3.5"/>
    <circle cx="404" cy="196" r="26" fill="#FFC8DD" stroke="#E86A92" stroke-width="3.5"/>
    <circle cx="352" cy="206" r="23" fill="#FFC8DD" stroke="#E86A92" stroke-width="3.5"/>
    <g stroke="#E86A92" stroke-width="2.5" fill="none" opacity="0.75">
      <path d="M352 158 q14 12 0 26 q-14 12 2 24"/>
      <path d="M386 170 q12 12 -2 22"/>
    </g>
    <text x="378" y="256" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" font-weight="700" fill="#C24D77">大脑</text>
  </g>

  <!-- 眼睛 -->
  <g>
    <ellipse cx="520" cy="188" rx="52" ry="32" fill="#FFFFFF" stroke="#4B5563" stroke-width="3"/>
    <circle cx="520" cy="188" r="19" fill="#7FD6FF" stroke="#3B82F6" stroke-width="3"/>
    <circle cx="520" cy="188" r="9" fill="#1F2937"/>
    <circle cx="528" cy="180" r="4.5" fill="#FFFFFF"/>
    <text x="520" y="256" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" font-weight="700" fill="#1D4ED8">眼睛</text>
  </g>

  <text x="320" y="332" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" fill="#2F3542">DHA 就像盖房子用的砖：大脑和眼睛长好要用一点点，但好好吃饭比吃胶囊更重要。</text>
</svg>
