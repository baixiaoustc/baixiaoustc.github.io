<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="三格对比图：紧实成块的羊肉串用一根签就够；软而薄的韭菜、金针菇要两根签夹住才不会卷着打转；整根玉米、整只鸡翅又大又重，要两三根签分担重量才翻得动">
  <rect x="0" y="0" width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" fill="#2A2A2A">签子几根，看它会不会打转</text>

  <rect x="28" y="76" width="180" height="224" rx="14" fill="#FFF5EC" stroke="#E8C79A" stroke-width="1.5"/>
  <text x="118" y="104" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" fill="#8A5A0B">羊肉串</text>
  <text x="118" y="124" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#A8845A">切得方正、紧实</text>
  <line x1="40" y1="180" x2="196" y2="180" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <rect x="48" y="168" width="30" height="24" rx="6" fill="#E8B98A" stroke="#C08A50" stroke-width="1.5"/>
  <rect x="86" y="168" width="30" height="24" rx="6" fill="#E8B98A" stroke="#C08A50" stroke-width="1.5"/>
  <rect x="124" y="168" width="30" height="24" rx="6" fill="#E8B98A" stroke="#C08A50" stroke-width="1.5"/>
  <rect x="162" y="168" width="30" height="24" rx="6" fill="#E8B98A" stroke="#C08A50" stroke-width="1.5"/>
  <text x="118" y="220" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#8A5A0B">一根</text>
  <text x="118" y="252" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">有块头，穿上就抓得住</text>
  <text x="118" y="274" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">翻面也不打转</text>

  <rect x="230" y="76" width="180" height="224" rx="14" fill="#EFF7EC" stroke="#AFCBA8" stroke-width="1.5"/>
  <text x="320" y="104" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" fill="#2F6B34">韭菜 · 金针菇</text>
  <text x="320" y="124" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#5C8158">软、薄、长，会卷起来</text>
  <ellipse cx="320" cy="182" rx="64" ry="20" fill="#DDEFD7" stroke="#7CB07A" stroke-width="1.5"/>
  <line x1="240" y1="170" x2="400" y2="170" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="194" x2="400" y2="194" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <text x="320" y="220" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#2F6B34">两根</text>
  <text x="320" y="252" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">一根它会绕着转、往下滑</text>
  <text x="320" y="274" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">两根夹住，方向就锁死了</text>

  <rect x="432" y="76" width="180" height="224" rx="14" fill="#FDEFF2" stroke="#E0B3BE" stroke-width="1.5"/>
  <text x="522" y="104" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" fill="#8C2F4A">整根玉米 · 鸡翅</text>
  <text x="522" y="124" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#A56A7C">又大、又重、形状歪</text>
  <ellipse cx="522" cy="182" rx="52" ry="26" fill="#FBE3D0" stroke="#D9A57A" stroke-width="1.5"/>
  <line x1="446" y1="166" x2="598" y2="166" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <line x1="446" y1="182" x2="598" y2="182" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <line x1="446" y1="198" x2="598" y2="198" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <text x="522" y="220" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#8C2F4A">两三根</text>
  <text x="522" y="252" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">一根扛不住，翻面就垂</text>
  <text x="522" y="274" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">多几根，重量分成好几份</text>

  <text x="320" y="330" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#2A2A2A">一根签只是一根轴，东西能绕着它转；两根签就是两个支点</text>
  <text x="320" y="356" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6A6A6A">越软、越薄、越重，就越需要多一根——不是为了多，是为了不转、不散</text>
</svg>
