<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Three panels: the name breaks into Central + Fine Arts + Academy, meaning an art university in Beijing, founded in 1918; inside you study fine art, design, architecture and art history; to get in you draw for years, then pass the art exam, CAFA's own exam, and the gaokao. Bottom line: CAFA is a school — not a painting, not a museum, though it has its own art museum.">
  <rect x="0" y="0" width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" fill="#2C2A26">CAFA is an art university that teaches people to draw</text>

  <!-- ① 名字拆开 -->
  <rect x="32" y="70" width="176" height="250" rx="12" fill="#F4EFE3" stroke="#D8CDB8"/>
  <text x="46" y="96" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#8A6B2F">① Break the name apart</text>
  <text x="120" y="128" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">Central + Fine Arts + Academy</text>
  <text x="120" y="152" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">= an art university</text>
  <path d="M64 226 L120 196 L176 226" fill="none" stroke="#8A6B2F" stroke-width="2"/>
  <rect x="64" y="226" width="112" height="52" fill="#FFFDF7" stroke="#8A6B2F" stroke-width="2"/>
  <rect x="108" y="244" width="24" height="34" fill="#E4D9C4" stroke="#8A6B2F" stroke-width="1.5"/>
  <text x="120" y="242" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#8A6B2F">CAFA</text>
  <text x="120" y="300" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#5C564B">In Beijing, founded 1918</text>

  <!-- ② 里面学什么 -->
  <rect x="232" y="70" width="176" height="250" rx="12" fill="#F4EFE3" stroke="#D8CDB8"/>
  <text x="246" y="96" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#8A6B2F">② What you study</text>
  <ellipse cx="384" cy="118" rx="18" ry="12" fill="#FFFDF7" stroke="#8A6B2F" stroke-width="1.5"/>
  <circle cx="376" cy="114" r="2.5" fill="#C4574A"/><circle cx="384" cy="112" r="2.5" fill="#6FA98B"/>
  <circle cx="392" cy="115" r="2.5" fill="#C8A45C"/><circle cx="380" cy="122" r="2.5" fill="#5B7FA6"/>
  <text x="246" y="150" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">Fine art: oil, ink</text>
  <text x="246" y="176" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">Sculpture, printmaking</text>
  <text x="246" y="206" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">Design: visual, product</text>
  <text x="246" y="232" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">Fashion, digital media</text>
  <text x="246" y="262" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">Architecture, experimental art</text>
  <text x="246" y="292" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#5C564B">Become a painter or designer</text>

  <!-- ③ 怎么进去 -->
  <rect x="432" y="70" width="176" height="250" rx="12" fill="#F4EFE3" stroke="#D8CDB8"/>
  <text x="446" y="96" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#8A6B2F">③ How to get in</text>
  <rect x="452" y="112" width="136" height="30" rx="6" fill="#FFFDF7" stroke="#C8A45C"/>
  <text x="520" y="132" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">Draw for years</text>
  <rect x="452" y="156" width="136" height="30" rx="6" fill="#FFFDF7" stroke="#C8A45C"/>
  <text x="520" y="176" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">Art exam: drawing, colour</text>
  <rect x="452" y="200" width="136" height="30" rx="6" fill="#FFFDF7" stroke="#C8A45C"/>
  <text x="520" y="220" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">CAFA's own exam</text>
  <rect x="452" y="244" width="136" height="30" rx="6" fill="#FFFDF7" stroke="#C8A45C"/>
  <text x="520" y="264" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">Gaokao pass mark</text>
  <line x1="520" y1="142" x2="520" y2="156" stroke="#8A6B2F" stroke-width="2"/>
  <line x1="520" y1="186" x2="520" y2="200" stroke="#8A6B2F" stroke-width="2"/>
  <line x1="520" y1="230" x2="520" y2="244" stroke="#8A6B2F" stroke-width="2"/>
  <text x="520" y="300" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#5C564B">Miss one and you are out</text>

  <text x="320" y="356" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#2C2A26">CAFA is a school — not a painting, not a museum</text>
  <text x="320" y="380" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#8A6B2F">Though it does have its own art museum</text>
</svg>
