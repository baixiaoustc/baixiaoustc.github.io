<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A flow diagram: cardboard boxes, empty bottles and old appliances that a household or neighbourhood wants to throw away are bought by weight at a very low price by the scrap collector, who then sorts them into paper, plastic and metal, bales them into one big pack and sells them by the tonne to paper mills, plastics plants, aluminium smelters and steel works; he earns the gap between the buying price and the selling price by collecting many households' small piles into one big truckload">
  <rect x="0" y="0" width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" fill="#2A2A2A">He earns the gap of gathering the scattered into one pile</text>

  <rect x="28" y="104" width="150" height="150" rx="14" fill="#EAF1FF" stroke="#B7CFE8" stroke-width="1.5"/>
  <text x="103" y="132" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="17" fill="#1F4E79">Home · neighbourhood</text>
  <text x="103" y="162" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#5C7691">Old cardboard</text>
  <text x="103" y="184" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#5C7691">Empty bottles</text>
  <text x="103" y="206" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#5C7691">Old appliances</text>
  <text x="103" y="238" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#7A93AD">to you: just rubbish</text>

  <path d="M182 179 L214 179 L207 173 M214 179 L207 185" fill="none" stroke="#5C7691" stroke-width="2"/>
  <text x="198" y="203" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#5C7691">buys by weight</text>

  <rect x="222" y="88" width="196" height="180" rx="14" fill="#FFF1D6" stroke="#E8C97A" stroke-width="1.5"/>
  <text x="320" y="118" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="18" fill="#8A5A0B">The scrap collector</text>
  <text x="320" y="148" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6B5320">1 buys cheap, by weight</text>
  <text x="320" y="172" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6B5320">2 sorts paper / plastic / metal</text>
  <text x="320" y="196" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6B5320">3 bales into one pack</text>
  <text x="320" y="228" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#9A7B3A">mixed, nobody wants it</text>
  <text x="320" y="250" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#9A7B3A">sorted, factories want it</text>

  <path d="M422 179 L448 124 L444 132 M448 124 L447 133" fill="none" stroke="#6B5320" stroke-width="2"/>
  <path d="M422 179 L448 202 L443 195 M448 202 L443 196" fill="none" stroke="#6B5320" stroke-width="2"/>
  <path d="M422 179 L448 280 L442 273 M448 280 L442 274" fill="none" stroke="#6B5320" stroke-width="2"/>
  <text x="434" y="212" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#8A5A0B">sells by the tonne</text>

  <rect x="456" y="92" width="150" height="64" rx="12" fill="#E8F3E6" stroke="#B5D3B0" stroke-width="1.5"/>
  <text x="531" y="118" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#2F6B34">Paper mill</text>
  <text x="531" y="140" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#4F7A52">pulp to new boxes</text>

  <rect x="456" y="170" width="150" height="64" rx="12" fill="#FDE8E8" stroke="#E8B4B4" stroke-width="1.5"/>
  <text x="531" y="196" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#8C2F2F">Plastics plant</text>
  <text x="531" y="218" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#8C5A5A">pellets for buckets, hangers</text>

  <rect x="456" y="248" width="150" height="64" rx="12" fill="#EDE9FE" stroke="#C4BCEB" stroke-width="1.5"/>
  <text x="531" y="274" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#4B3F8A">Aluminium &amp; steel</text>
  <text x="531" y="296" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#6A60A8">remelt into ingots, rebar</text>

  <text x="320" y="332" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#2A2A2A">Profit = sold for − paid for</text>
  <text x="320" y="358" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6A6A6A">Not a trick on the scale: many households' small piles into one big load</text>
</svg>
