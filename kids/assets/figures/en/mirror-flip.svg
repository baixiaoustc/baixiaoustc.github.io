<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Three panels: light bounces off a mirror like a ball off a wall; light from both hands goes straight there and back, so the left hand stays left; laid flat, the mirror keeps left and right but flips up and down">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="46" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="22" font-weight="700" fill="#2F3542">A mirror flips front-and-back, not left-and-right</text>

  <!-- ① 光像球撞墙一样原路弹回 -->
  <rect x="30" y="74" width="180" height="176" rx="16" fill="#EFF6FB" stroke="#5FB4D8" stroke-width="2.5"/>
  <!-- 人 -->
  <circle cx="76" cy="140" r="11" fill="#FFFFFF" stroke="#7FC6A8" stroke-width="3"/>
  <path d="M66 158 h20 v34 h-20 z" fill="#FFFFFF" stroke="#7FC6A8" stroke-width="3" stroke-linejoin="round"/>
  <line x1="86" y1="166" x2="104" y2="152" stroke="#7FC6A8" stroke-width="3" stroke-linecap="round"/>
  <!-- 镜子 -->
  <rect x="138" y="94" width="9" height="132" rx="4" fill="#DCEBF7" stroke="#5FB4D8" stroke-width="2.5"/>
  <line x1="142" y1="98" x2="142" y2="222" stroke="#8FC7E4" stroke-width="2" stroke-dasharray="4 5"/>
  <!-- 去的光 / 回来的光 -->
  <line x1="106" y1="152" x2="132" y2="152" stroke="#E4655F" stroke-width="3" stroke-linecap="round"/>
  <path d="M132 152 l-9 -5 v10 z" fill="#E4655F"/>
  <line x1="132" y1="176" x2="106" y2="176" stroke="#E4655F" stroke-width="3" stroke-linecap="round"/>
  <path d="M106 176 l9 -5 v10 z" fill="#E4655F"/>
  <text x="162" y="150" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="12" fill="#C2453F">Hits the glass</text>
  <text x="162" y="180" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="12" fill="#C2453F">Bounces straight back</text>

  <!-- ② 左手的光回到左边，右手的光回到右边 -->
  <rect x="230" y="74" width="180" height="176" rx="16" fill="#EFF6FB" stroke="#5FB4D8" stroke-width="2.5"/>
  <!-- 镜面（俯视看是一条横线） -->
  <rect x="246" y="96" width="148" height="8" rx="4" fill="#DCEBF7" stroke="#5FB4D8" stroke-width="2.5"/>
  <text x="320" y="90" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="11" fill="#3D8FB0">Mirror</text>
  <!-- 人（俯视：两个手的位置） -->
  <circle cx="320" cy="214" r="12" fill="#FFFFFF" stroke="#7FC6A8" stroke-width="3"/>
  <circle cx="286" cy="176" r="6" fill="#E4655F"/>
  <circle cx="354" cy="176" r="6" fill="#3D8FB0"/>
  <line x1="286" y1="182" x2="308" y2="206" stroke="#E4655F" stroke-width="2.5"/>
  <line x1="354" y1="182" x2="332" y2="206" stroke="#3D8FB0" stroke-width="2.5"/>
  <!-- 两手的光直去直回 -->
  <line x1="286" y1="170" x2="286" y2="108" stroke="#E4655F" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="286" y1="108" x2="286" y2="170" stroke="none"/>
  <line x1="354" y1="170" x2="354" y2="108" stroke="#3D8FB0" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="278" y="196" text-anchor="end" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="12" fill="#C2453F">Left</text>
  <text x="362" y="196" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="12" fill="#3D8FB0">Right</text>
  <text x="320" y="240" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="12" fill="#6B7280">Light goes straight there and back — no crossing</text>

  <!-- ③ 镜子平放：左右没变，上下反了 -->
  <rect x="430" y="74" width="180" height="176" rx="16" fill="#EFF6FB" stroke="#5FB4D8" stroke-width="2.5"/>
  <!-- 平放的镜子 -->
  <ellipse cx="520" cy="196" rx="62" ry="12" fill="#DCEBF7" stroke="#5FB4D8" stroke-width="2.5"/>
  <!-- 站着的人 -->
  <circle cx="520" cy="140" r="11" fill="#FFFFFF" stroke="#7FC6A8" stroke-width="3"/>
  <line x1="520" y1="151" x2="520" y2="180" stroke="#7FC6A8" stroke-width="3" stroke-linecap="round"/>
  <!-- 倒过来的像 -->
  <line x1="520" y1="212" x2="520" y2="234" stroke="#7FC6A8" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4"/>
  <circle cx="520" cy="240" r="11" fill="none" stroke="#7FC6A8" stroke-width="3" stroke-dasharray="5 4"/>
  <!-- 左右没变 / 上下反了 -->
  <line x1="456" y1="160" x2="484" y2="160" stroke="#5FB4D8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M456 160 l8 -5 v10 z" fill="#5FB4D8"/>
  <path d="M484 160 l-8 -5 v10 z" fill="#5FB4D8"/>
  <text x="470" y="150" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="11" fill="#3D8FB0">Left stays left</text>
  <line x1="576" y1="132" x2="576" y2="164" stroke="#E4655F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M576 132 l-5 8 h10 z" fill="#E4655F"/>
  <path d="M576 164 l-5 -8 h10 z" fill="#E4655F"/>
  <text x="576" y="122" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="11" fill="#C2453F">Up and down flip</text>

  <!-- 分段说明 -->
  <text x="120" y="276" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#2F6E8C">① Light bounces back</text>
  <text x="120" y="300" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">A wall, not a door</text>
  <text x="120" y="322" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">Light hits, straight back</text>

  <text x="320" y="276" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#2F6E8C">② Left is left, right is right</text>
  <text x="320" y="300" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">Only front-and-back swaps</text>
  <text x="320" y="322" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">Right hand stays right</text>

  <text x="520" y="276" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#2F6E8C">③ Flat: up and down flip</text>
  <text x="520" y="300" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">Only the facing side flips</text>
  <text x="520" y="322" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">Brain: someone turned round</text>

  <line x1="60" y1="342" x2="580" y2="342" stroke="#E6E1D6" stroke-width="2"/>
  <text x="320" y="372" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" fill="#6B7280">Mirror returns the facing side; reversed is your brain adding a turn.</text>
</svg>
