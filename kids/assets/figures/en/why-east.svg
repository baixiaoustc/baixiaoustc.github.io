<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Two panels: from Europe, China lies east where the sun rises, so it is called the East; from the US, across the Pacific, the same China is west — the place did not move, the direction flipped">
  <rect x="0" y="0" width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" fill="#2A2A2A">East is not a label: it depends where you stand</text>

  <rect x="28" y="68" width="272" height="238" rx="14" fill="#FFF5EC" stroke="#E8C79A" stroke-width="1.5"/>
  <text x="164" y="97" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" fill="#8A5A0B">① Europeans in the middle</text>
  <text x="164" y="119" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#A8845A">the side where the sun rises is 'East'</text>

  <line x1="48" y1="182" x2="280" y2="182" stroke="#D8C4A8" stroke-width="1.5"/>
  <line x1="122" y1="158" x2="238" y2="158" stroke="#C8A45C" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M238 158 L230 153 L230 163 Z" fill="#C8A45C"/>
  <text x="180" y="148" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#A8845A">look east</text>

  <text x="52" y="174" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#A8845A">West</text>
  <text x="270" y="174" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#A8845A">East</text>

  <circle cx="112" cy="182" r="7" fill="#8A5A0B"/>
  <text x="112" y="206" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#8A5A0B">Europe</text>

  <circle cx="252" cy="182" r="7" fill="#C8A45C"/>
  <text x="252" y="206" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#8A5A0B">China</text>

  <text x="164" y="244" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">China lies east of Europe</text>
  <text x="164" y="266" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">so it got called 'the East'</text>
  <text x="164" y="290" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#A8845A">Orient means: where the sun rises</text>

  <rect x="340" y="68" width="272" height="238" rx="14" fill="#EFF4FA" stroke="#AFC4DA" stroke-width="1.5"/>
  <text x="476" y="97" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" fill="#2F5B7D">② Now an American in the middle</text>
  <text x="476" y="119" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#6D8FA8">same place, flipped direction</text>

  <line x1="360" y1="182" x2="592" y2="182" stroke="#C3D3E0" stroke-width="1.5"/>
  <line x1="424" y1="158" x2="540" y2="158" stroke="#7FA3BE" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M424 158 L432 153 L432 163 Z" fill="#7FA3BE"/>
  <text x="482" y="148" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#6D8FA8">look west</text>

  <text x="364" y="174" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6D8FA8">West</text>
  <text x="582" y="174" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6D8FA8">East</text>

  <circle cx="400" cy="182" r="7" fill="#C8A45C"/>
  <text x="400" y="206" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#2F5B7D">China</text>

  <circle cx="548" cy="182" r="7" fill="#2F5B7D"/>
  <text x="548" y="206" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#2F5B7D">the US</text>

  <text x="476" y="244" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">across the Pacific, China is west of the US</text>
  <text x="476" y="266" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">the same China becomes 'the West'</text>
  <text x="476" y="290" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#6D8FA8">the place did not move; the viewer did</text>

  <text x="320" y="336" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#2A2A2A">Same China, not a step moved — only the viewer changed</text>
  <text x="320" y="362" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6A6A6A">East and West are relative directions; the cultural layer came later</text>
</svg>
