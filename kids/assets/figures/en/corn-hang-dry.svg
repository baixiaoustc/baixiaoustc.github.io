<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="In northeast China winter, corn cobs hang on a raised wooden rack so the dry cold wind passes between them and carries the moisture away">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>

  <text x="320" y="46" text-anchor="middle" font-size="22" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#2B2B2B">Hang it up, and the corn dries</text>

  <!-- 左侧：风 -->
  <text x="52" y="102" font-size="15" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#3A5A6B">Wind on every cob</text>
  <g stroke="#7BA8C0" stroke-width="2" stroke-dasharray="9 7">
    <line x1="44" y1="140" x2="132" y2="140"/>
    <line x1="44" y1="200" x2="132" y2="200"/>
    <line x1="44" y1="260" x2="132" y2="260"/>
    <line x1="44" y1="316" x2="132" y2="316"/>
  </g>
  <g fill="#7BA8C0">
    <polygon points="132,140 122,135 122,145"/>
    <polygon points="132,200 122,195 122,205"/>
    <polygon points="132,260 122,255 122,265"/>
    <polygon points="132,316 122,311 122,321"/>
  </g>

  <!-- 右侧：温度 -->
  <rect x="470" y="66" width="150" height="40" rx="12" fill="#E6F0F5"/>
  <text x="545" y="92" text-anchor="middle" font-size="15" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#3A5A6B">−20℃ · dry wind</text>

  <!-- 苞米楼子：顶棚 + 立柱 + 两道横梁 -->
  <line x1="150" y1="136" x2="320" y2="104" stroke="#A8845F" stroke-width="5"/>
  <line x1="320" y1="104" x2="490" y2="136" stroke="#A8845F" stroke-width="5"/>
  <line x1="178" y1="130" x2="178" y2="330" stroke="#8A6B4F" stroke-width="7"/>
  <line x1="462" y1="130" x2="462" y2="330" stroke="#8A6B4F" stroke-width="7"/>
  <line x1="152" y1="178" x2="488" y2="178" stroke="#A8845F" stroke-width="5"/>
  <line x1="152" y1="268" x2="488" y2="268" stroke="#A8845F" stroke-width="5"/>

  <!-- 上层玉米（挂在第一道横梁） -->
  <g fill="#E9B84A" stroke="#C08E2C" stroke-width="2">
    <ellipse cx="212" cy="212" rx="13" ry="32"/>
    <ellipse cx="262" cy="212" rx="13" ry="32"/>
    <ellipse cx="312" cy="212" rx="13" ry="32"/>
    <ellipse cx="362" cy="212" rx="13" ry="32"/>
    <ellipse cx="412" cy="212" rx="13" ry="32"/>
    <ellipse cx="452" cy="212" rx="13" ry="32"/>
  </g>
  <!-- 下层玉米（挂在第二道横梁） -->
  <g fill="#E9B84A" stroke="#C08E2C" stroke-width="2">
    <ellipse cx="237" cy="302" rx="12" ry="27"/>
    <ellipse cx="287" cy="302" rx="12" ry="27"/>
    <ellipse cx="337" cy="302" rx="12" ry="27"/>
    <ellipse cx="387" cy="302" rx="12" ry="27"/>
    <ellipse cx="437" cy="302" rx="12" ry="27"/>
  </g>
  <!-- 玉米顶部的小挂钩 -->
  <g stroke="#8A6B4F" stroke-width="2">
    <line x1="212" y1="178" x2="212" y2="182"/>
    <line x1="262" y1="178" x2="262" y2="182"/>
    <line x1="312" y1="178" x2="312" y2="182"/>
    <line x1="362" y1="178" x2="362" y2="182"/>
    <line x1="412" y1="178" x2="412" y2="182"/>
    <line x1="452" y1="178" x2="452" y2="182"/>
    <line x1="237" y1="268" x2="237" y2="276"/>
    <line x1="287" y1="268" x2="287" y2="276"/>
    <line x1="337" y1="268" x2="337" y2="276"/>
    <line x1="387" y1="268" x2="387" y2="276"/>
    <line x1="437" y1="268" x2="437" y2="276"/>
  </g>

  <!-- 被带走的水汽 -->
  <g fill="#8FC3D8">
    <ellipse cx="262" cy="336" rx="5" ry="7"/>
    <ellipse cx="312" cy="344" rx="5" ry="7"/>
    <ellipse cx="362" cy="336" rx="5" ry="7"/>
  </g>
  <text x="392" y="346" font-size="15" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#3A5A6B">Moisture blown off</text>

  <!-- 老鼠，够不着 -->
  <g fill="#9AA0A6">
    <ellipse cx="176" cy="364" rx="24" ry="13"/>
    <circle cx="200" cy="352" r="9"/>
    <ellipse cx="152" cy="360" rx="10" ry="4"/>
  </g>
  <circle cx="205" cy="349" r="2" fill="#3B3B3B"/>
  <text x="232" y="370" font-size="15" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#3A5A6B">Off the ground, no mice</text>
</svg>
