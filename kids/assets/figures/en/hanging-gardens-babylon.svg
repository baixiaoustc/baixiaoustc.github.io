<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Three panels: a king builds a garden for a queen who misses the mountains of home; the garden is a stack of terraces held up by arches, with river water lifted to the top and poured down; plants hang over the edges so it looks suspended in the air, but its ruins have never been found. Bottom note: the standard list is the Seven Wonders of the Ancient World — the Hanging Gardens is one of them; 'eighth wonder' is only a later phrase">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="21" font-weight="700" fill="#2F3542">A terraced garden built to cure a queen's homesickness</text>

  <!-- ① 为什么建 -->
  <rect x="30" y="68" width="180" height="180" rx="16" fill="#F7F4EC" stroke="#D8C6A5" stroke-width="2.5"/>
  <circle cx="100" cy="104" r="10" fill="#E8C98A" stroke="#B89355" stroke-width="2"/>
  <path d="M92 96 l8 -10 l8 10" fill="none" stroke="#B89355" stroke-width="2.5"/>
  <rect x="88" y="116" width="24" height="40" rx="6" fill="#DDBB7E" stroke="#B89355" stroke-width="2"/>
  <circle cx="148" cy="108" r="10" fill="#F0D3B6" stroke="#B89355" stroke-width="2"/>
  <rect x="140" y="120" width="16" height="36" rx="6" fill="#E9BFA0" stroke="#B89355" stroke-width="2"/>
  <path d="M160 112 q12 -18 28 -8" fill="none" stroke="#B89355" stroke-width="1.8" stroke-dasharray="4 4"/>
  <ellipse cx="174" cy="96" rx="24" ry="16" fill="#FFFFFF" stroke="#D8C6A5" stroke-width="1.8"/>
  <path d="M160 102 l8 -12 l8 12 l8 -12 l8 12" fill="none" stroke="#7FA98A" stroke-width="2.2"/>
  <line x1="44" y1="196" x2="196" y2="196" stroke="#D8C6A5" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="224" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" font-weight="600" fill="#7A5B2E">Built for a homesick queen</text>

  <!-- ② 怎么造 -->
  <rect x="230" y="68" width="180" height="180" rx="16" fill="#F4FBF6" stroke="#86D3A8" stroke-width="2.5"/>
  <line x1="244" y1="216" x2="396" y2="216" stroke="#C7DCCB" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="252" y="200" width="136" height="12" rx="3" fill="#D9C6A8" stroke="#A98B62" stroke-width="1.5"/>
  <rect x="264" y="180" width="112" height="12" rx="3" fill="#D9C6A8" stroke="#A98B62" stroke-width="1.5"/>
  <rect x="276" y="160" width="88" height="12" rx="3" fill="#D9C6A8" stroke="#A98B62" stroke-width="1.5"/>
  <rect x="288" y="140" width="64" height="12" rx="3" fill="#D9C6A8" stroke="#A98B62" stroke-width="1.5"/>
  <g stroke="#A98B62" stroke-width="1.8" fill="none">
    <path d="M258 200 q10 -12 20 0"/>
    <path d="M290 200 q10 -12 20 0"/>
    <path d="M322 200 q10 -12 20 0"/>
    <path d="M354 200 q10 -12 20 0"/>
  </g>
  <g stroke="#8EB8E0" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M246 216 q12 -6 24 0 q12 6 24 0 q12 -6 24 0 q12 6 24 0"/>
    <path d="M386 214 q-8 -30 -18 -48 q-8 -16 -6 -30 q2 -12 10 -20"/>
  </g>
  <path d="M372 106 l8 -8 l8 8" fill="none" stroke="#8EB8E0" stroke-width="2.4"/>
  <circle cx="320" cy="126" r="3" fill="#8EB8E0"/>
  <circle cx="320" cy="134" r="2.5" fill="#8EB8E0" opacity="0.8"/>
  <text x="320" y="232" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" font-weight="600" fill="#3E7F58">Water lifted up, then poured down</text>

  <!-- ③ 为什么叫空中 / 遗址 -->
  <rect x="430" y="68" width="180" height="180" rx="16" fill="#F4F7FB" stroke="#9BB8D6" stroke-width="2.5"/>
  <line x1="444" y1="208" x2="596" y2="208" stroke="#C7DCCB" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="456" y="188" width="90" height="20" rx="3" fill="#D9C6A8" stroke="#A98B62" stroke-width="1.5"/>
  <rect x="466" y="166" width="70" height="22" rx="3" fill="#D9C6A8" stroke="#A98B62" stroke-width="1.5"/>
  <rect x="476" y="144" width="50" height="22" rx="3" fill="#D9C6A8" stroke="#A98B62" stroke-width="1.5"/>
  <g stroke="#4C9A6B" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M456 188 q-2 14 0 20"/>
    <path d="M476 188 q-3 16 1 22"/>
    <path d="M500 188 q2 15 0 21"/>
    <path d="M466 166 q-2 12 0 18"/>
    <path d="M492 166 q3 12 0 18"/>
    <path d="M476 144 q-2 14 0 20"/>
    <path d="M506 144 q3 14 0 20"/>
  </g>
  <g fill="#6FBF8B" stroke="#3E7F58" stroke-width="1.2">
    <circle cx="452" cy="184" r="4"/>
    <circle cx="474" cy="184" r="4"/>
    <circle cx="502" cy="184" r="4"/>
    <circle cx="462" cy="162" r="3.5"/>
    <circle cx="494" cy="162" r="3.5"/>
    <circle cx="474" cy="140" r="3.5"/>
    <circle cx="508" cy="140" r="3.5"/>
  </g>
  <path d="M570 208 q-12 -18 2 -30 q14 -12 24 2 q10 14 -4 28" fill="#E4D3B8" stroke="#A98B62" stroke-width="1.8"/>
  <text x="583" y="190" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="18" font-weight="700" fill="#7A5B2E">?</text>
  <path d="M540 126 q16 -22 34 -10" fill="none" stroke="#9BB8D6" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="557" y="118" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="12.5" fill="#3C6C96">Not floating</text>
  <text x="520" y="232" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" font-weight="600" fill="#3C6C96">Vines hang over the edge</text>

  <text x="320" y="348" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="14.5" font-weight="600" fill="#2F3542">The standard list is seven wonders, not eight</text>
  <text x="320" y="374" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="14" fill="#6B7280">An 'eighth wonder' is just a saying, not an official list</text>
</svg>
