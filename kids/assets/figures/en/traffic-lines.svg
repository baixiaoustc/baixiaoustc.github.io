<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A top-down view of a two-way road: a dashed white line separates lanes going the same way and may be crossed, a solid white line may not; a double solid yellow line down the middle separates opposite directions and neither side may cross it; only a dashed yellow line allows overtaking, and a solid yellow line by the kerb means no parking">
  <rect x="0" y="0" width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" fill="#2A2A2A">White = same way, Yellow = opposite</text>

  <rect x="205" y="64" width="250" height="256" fill="#8C9299"/>
  <rect x="205" y="64" width="250" height="256" fill="none" stroke="#7A8087" stroke-width="1"/>

  <line x1="212" y1="64" x2="212" y2="320" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="448" y1="64" x2="448" y2="320" stroke="#FFFFFF" stroke-width="3"/>

  <line x1="326" y1="64" x2="326" y2="320" stroke="#E5B22F" stroke-width="4"/>
  <line x1="334" y1="64" x2="334" y2="320" stroke="#E5B22F" stroke-width="4"/>

  <line x1="265" y1="64" x2="265" y2="320" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14 12"/>
  <line x1="394" y1="64" x2="394" y2="320" stroke="#FFFFFF" stroke-width="3"/>

  <path d="M235 216 L225 196 L245 196 Z" fill="#EAF1FF"/>
  <line x1="235" y1="196" x2="235" y2="160" stroke="#EAF1FF" stroke-width="3"/>
  <path d="M295 156 L285 136 L305 136 Z" fill="#EAF1FF"/>
  <line x1="295" y1="136" x2="295" y2="104" stroke="#EAF1FF" stroke-width="3"/>

  <path d="M364 104 L354 124 L374 124 Z" fill="#EAF1FF"/>
  <line x1="364" y1="124" x2="364" y2="160" stroke="#EAF1FF" stroke-width="3"/>
  <path d="M424 164 L414 184 L434 184 Z" fill="#EAF1FF"/>
  <line x1="424" y1="184" x2="424" y2="216" stroke="#EAF1FF" stroke-width="3"/>

  <line x1="196" y1="150" x2="258" y2="150" stroke="#9BB4CC" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="192" y="128" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="17" fill="#1F6FB2">White dashed</text>
  <text x="192" y="150" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#555">same way · switch okay</text>

  <line x1="466" y1="150" x2="400" y2="150" stroke="#9BB4CC" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="470" y="128" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="17" fill="#1F6FB2">White solid</text>
  <text x="470" y="150" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#555">same way · no crossing</text>

  <line x1="330" y1="322" x2="330" y2="334" stroke="#C79A2A" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="330" y="354" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="17" fill="#B8830F">Double solid yellow: opposite traffic, nobody may cross</text>
  <text x="330" y="378" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#7A7A7A">only dashed yellow may be crossed to overtake ｜ solid yellow at the kerb = no parking</text>
</svg>
