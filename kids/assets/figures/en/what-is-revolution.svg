<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Three rows: a political revolution changes who decides — from a king deciding alone to everyone voting; an industrial revolution changes how things are made — from one pair of shoes a day by hand to hundreds a day by machine; a scientific revolution changes how we decide what is true — from what the book says to what your own experiment shows. Bottom line: reform edits clauses in the same book; revolution replaces the whole book">
  <rect x="0" y="0" width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="20" fill="#2A2A2A">A revolution swaps a whole way of doing things, not one person</text>

  <rect x="28" y="66" width="584" height="82" rx="14" fill="#FFF5EC" stroke="#E8C79A" stroke-width="1.5"/>
  <text x="48" y="98" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="17" fill="#8A5A0B">Political revolution</text>
  <text x="48" y="120" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#A8845A">changes who decides</text>
  <text x="236" y="110" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6A6A6A">a king decides alone</text>
  <line x1="330" y1="105" x2="360" y2="105" stroke="#C8A45C" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M360 105 L352 100 L352 110 Z" fill="#C8A45C"/>
  <text x="372" y="110" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#8A5A0B">everyone votes</text>
  <text x="48" y="140" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#A8845A">same place, the whole rulebook replaced</text>

  <rect x="28" y="158" width="584" height="82" rx="14" fill="#EFF4FA" stroke="#AFC4DA" stroke-width="1.5"/>
  <text x="48" y="190" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="17" fill="#2F5B7D">Industrial revolution</text>
  <text x="48" y="212" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6D8FA8">changes how things are made</text>
  <text x="236" y="202" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6A6A6A">one pair of shoes a day by hand</text>
  <line x1="330" y1="197" x2="360" y2="197" stroke="#7FA3BE" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M360 197 L352 192 L352 202 Z" fill="#7FA3BE"/>
  <text x="372" y="202" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#2F5B7D">hundreds a day by machine</text>
  <text x="48" y="232" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#6D8FA8">no slogans — machines did the changing</text>

  <rect x="28" y="250" width="584" height="82" rx="14" fill="#F1F7EF" stroke="#B6D3A8" stroke-width="1.5"/>
  <text x="48" y="282" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="17" fill="#4A6B33">Scientific revolution</text>
  <text x="48" y="304" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6E8A55">changes how we think</text>
  <text x="236" y="294" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6A6A6A">what the book says counts</text>
  <line x1="330" y1="289" x2="360" y2="289" stroke="#8FB37C" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M360 289 L352 284 L352 294 Z" fill="#8FB37C"/>
  <text x="372" y="294" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#4A6B33">what your experiment shows counts</text>
  <text x="48" y="324" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#6E8A55">the way we judge what is true changed</text>

  <line x1="48" y1="352" x2="592" y2="352" stroke="#E2DCCF" stroke-width="1.2"/>
  <text x="320" y="378" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#2A2A2A">Reform = amend clauses in the same book  |  Revolution = replace the whole book</text>
</svg>
