<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Three panels comparing skewers: firm cubed lamb needs just one stick; soft thin chives and enoki mushrooms need two sticks to clamp them so they do not curl and spin; a whole corn cob or whole chicken wing is big and heavy and needs two or three sticks to share the weight so it can be turned">
  <rect x="0" y="0" width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" fill="#2A2A2A">How many sticks? Depends on whether it spins</text>

  <rect x="28" y="76" width="180" height="224" rx="14" fill="#FFF5EC" stroke="#E8C79A" stroke-width="1.5"/>
  <text x="118" y="104" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" fill="#8A5A0B">Lamb skewer</text>
  <text x="118" y="124" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#A8845A">cubed and firm</text>
  <line x1="40" y1="180" x2="196" y2="180" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <rect x="48" y="168" width="30" height="24" rx="6" fill="#E8B98A" stroke="#C08A50" stroke-width="1.5"/>
  <rect x="86" y="168" width="30" height="24" rx="6" fill="#E8B98A" stroke="#C08A50" stroke-width="1.5"/>
  <rect x="124" y="168" width="30" height="24" rx="6" fill="#E8B98A" stroke="#C08A50" stroke-width="1.5"/>
  <rect x="162" y="168" width="30" height="24" rx="6" fill="#E8B98A" stroke="#C08A50" stroke-width="1.5"/>
  <text x="118" y="220" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#8A5A0B">one stick</text>
  <text x="118" y="252" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">chunky: it grips the stick</text>
  <text x="118" y="274" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">turn it, it stays put</text>

  <rect x="230" y="76" width="180" height="224" rx="14" fill="#EFF7EC" stroke="#AFCBA8" stroke-width="1.5"/>
  <text x="320" y="104" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" fill="#2F6B34">Chives · enoki</text>
  <text x="320" y="124" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#5C8158">soft, thin, curls up</text>
  <ellipse cx="320" cy="182" rx="64" ry="20" fill="#DDEFD7" stroke="#7CB07A" stroke-width="1.5"/>
  <line x1="240" y1="170" x2="400" y2="170" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="194" x2="400" y2="194" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <text x="320" y="220" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#2F6B34">two sticks</text>
  <text x="320" y="252" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">on one it spins and slides</text>
  <text x="320" y="274" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">two clamp it, no twisting</text>

  <rect x="432" y="76" width="180" height="224" rx="14" fill="#FDEFF2" stroke="#E0B3BE" stroke-width="1.5"/>
  <text x="522" y="104" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="16" fill="#8C2F4A">Whole corn · chicken wing</text>
  <text x="522" y="124" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#A56A7C">big, heavy, awkward shape</text>
  <ellipse cx="522" cy="182" rx="52" ry="26" fill="#FBE3D0" stroke="#D9A57A" stroke-width="1.5"/>
  <line x1="446" y1="166" x2="598" y2="166" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <line x1="446" y1="182" x2="598" y2="182" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <line x1="446" y1="198" x2="598" y2="198" stroke="#B98A5A" stroke-width="3" stroke-linecap="round"/>
  <text x="522" y="220" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#8C2F4A">two or three</text>
  <text x="522" y="252" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">one sags when turned</text>
  <text x="522" y="274" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6A6A6A">more sticks share the weight</text>

  <text x="320" y="330" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#2A2A2A">One stick is one axis: the food can spin around it. Two sticks are two pivots.</text>
  <text x="320" y="356" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6A6A6A">Softer, thinner, heavier needs one more — not for show, but so it will not spin or fall apart</text>
</svg>
