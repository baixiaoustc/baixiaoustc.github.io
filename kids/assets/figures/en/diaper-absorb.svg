<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Cross-section of a diaper: pee drips from above and passes through the top layer, absorbent beads in the middle drink it into a soft jelly, and a waterproof film at the bottom keeps it from leaking — so clothes, sheets and skin stay dry">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="22" font-weight="700" fill="#2F3542">How does a diaper drink up pee?</text>
  <text x="320" y="68" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="13" fill="#8A8F98">Cut a diaper open — here is what is inside</text>

  <!-- 滴下来的尿 -->
  <g fill="#7FBBD8">
    <circle cx="250" cy="102" r="9"/>
    <path d="M250 84 L244 96 h12 Z" fill="#7FBBD8"/>
    <circle cx="320" cy="102" r="9"/>
    <path d="M320 84 L314 96 h12 Z" fill="#7FBBD8"/>
    <circle cx="390" cy="102" r="9"/>
    <path d="M390 84 L384 96 h12 Z" fill="#7FBBD8"/>
  </g>
  <g stroke="#7FBBD8" stroke-width="2.5" stroke-linecap="round">
    <line x1="250" y1="114" x2="250" y2="124"/>
    <line x1="320" y1="114" x2="320" y2="124"/>
    <line x1="390" y1="114" x2="390" y2="124"/>
  </g>
  <g fill="#7FBBD8">
    <path d="M250 130 l-4 -7 h8 z"/>
    <path d="M320 130 l-4 -7 h8 z"/>
    <path d="M390 130 l-4 -7 h8 z"/>
  </g>

  <!-- 剖面：三层 -->
  <rect x="70" y="134" width="500" height="148" rx="18" fill="#FFFFFF" stroke="#AFCBDC" stroke-width="3"/>

  <!-- ① 表面层 -->
  <rect x="80" y="142" width="480" height="26" rx="9" fill="#F1F8FC" stroke="#D3E6F0" stroke-width="2"/>
  <text x="94" y="160" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="14" fill="#4B7E96">① Top layer: pee passes through; the skin side stays dry</text>

  <!-- ② 吸水芯层：小颗粒 + 吸饱的果冻 -->
  <rect x="80" y="168" width="480" height="82" rx="9" fill="#FFF9E8" stroke="#E9D9A9" stroke-width="2"/>
  <text x="94" y="186" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="14" fill="#8A6A2F">② Absorbent beads: they drink the pee into soft jelly</text>
  <g fill="#EFE0B4" stroke="#D5C087" stroke-width="1.5">
    <circle cx="112" cy="206" r="4.5"/>
    <circle cx="146" cy="224" r="4.5"/>
    <circle cx="178" cy="200" r="4.5"/>
    <circle cx="212" cy="232" r="4.5"/>
    <circle cx="244" cy="209" r="4.5"/>
    <circle cx="278" cy="226" r="4.5"/>
    <circle cx="312" cy="202" r="4.5"/>
    <circle cx="346" cy="232" r="4.5"/>
    <circle cx="382" cy="208" r="4.5"/>
    <circle cx="416" cy="228" r="4.5"/>
    <circle cx="450" cy="201" r="4.5"/>
    <circle cx="484" cy="230" r="4.5"/>
    <circle cx="518" cy="207" r="4.5"/>
    <circle cx="546" cy="224" r="4.5"/>
  </g>
  <g fill="#BFE2F5" stroke="#7FBBD8" stroke-width="2">
    <circle cx="160" cy="214" r="10"/>
    <circle cx="262" cy="218" r="11"/>
    <circle cx="360" cy="216" r="10"/>
    <circle cx="458" cy="216" r="9"/>
    <circle cx="520" cy="220" r="8"/>
  </g>
  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="156" cy="210" r="2.5"/>
    <circle cx="258" cy="214" r="3"/>
    <circle cx="356" cy="212" r="2.5"/>
    <circle cx="455" cy="212" r="2"/>
    <circle cx="517" cy="217" r="2"/>
  </g>

  <!-- ③ 防水膜 -->
  <rect x="80" y="250" width="480" height="22" rx="9" fill="#5F9DB5" stroke="#4A8AA2" stroke-width="2"/>
  <text x="94" y="265" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="13" fill="#FFFFFF">③ Waterproof film: a raincoat that stops leaks</text>

  <line x1="60" y1="304" x2="580" y2="304" stroke="#E6E1D6" stroke-width="2"/>
  <text x="320" y="332" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" fill="#6B7280">Babies pee when they want and cannot say — a diaper is 'pants that drink'</text>
  <text x="320" y="360" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="14" fill="#8A8F98">Water is soaked up and locked in jelly: clothes stay dry and skin stays calm</text>
</svg>
