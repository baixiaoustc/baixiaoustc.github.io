<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A mosquito spits saliva; your body's guards release histamine; the skin swells and itches">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="21" font-weight="700" fill="#2F3542">The bite does not itch — your little guards are fighting</text>

  <!-- 皮肤剖面 -->
  <rect x="26" y="234" width="336" height="34" fill="#FFE6CF"/>
  <rect x="26" y="268" width="336" height="56" fill="#FFCBB8"/>
  <rect x="26" y="324" width="336" height="26" fill="#FFF0E2"/>
  <g stroke="#E0B79C" stroke-width="2">
    <path d="M26 234 h336"/><path d="M26 268 h336"/><path d="M26 324 h336"/>
  </g>
  <text x="40" y="256" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="13" fill="#A9714B">Epidermis</text>
  <text x="40" y="300" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="13" fill="#B5623F">Dermis (vessels here)</text>
  <path d="M120 286 q30 -10 60 0" stroke="#E05B5B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="290" y="290" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="13" fill="#C05656">Blood vessel</text>

  <!-- 蚊子 -->
  <g transform="rotate(-16 170 170)">
    <ellipse cx="170" cy="170" rx="30" ry="14" fill="#6B7280"/>
    <ellipse cx="150" cy="152" rx="24" ry="10" fill="#D1D5DB" opacity="0.9" transform="rotate(-24 150 152)"/>
    <ellipse cx="150" cy="186" rx="22" ry="9" fill="#D1D5DB" opacity="0.9" transform="rotate(20 150 186)"/>
    <path d="M198 172 q14 4 20 8" stroke="#4B5563" stroke-width="3" fill="none"/>
    <g stroke="#4B5563" stroke-width="2.5" stroke-linecap="round">
      <path d="M158 182 l-6 14"/><path d="M172 184 l2 14"/><path d="M188 182 l10 12"/>
    </g>
  </g>
  <!-- 口器扎进皮肤 -->
  <path d="M204 186 L214 252" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <path d="M214 252 l-4 -10 l8 1 z" fill="#374151"/>

  <!-- 组胺小点 -->
  <g fill="#FF7A7A">
    <circle cx="200" cy="262" r="5"/><circle cx="226" cy="248" r="4"/>
    <circle cx="234" cy="276" r="5"/><circle cx="212" cy="286" r="4"/>
    <circle cx="188" cy="280" r="4"/><circle cx="246" cy="262" r="3.5"/>
  </g>
  <text x="262" y="250" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="13" font-weight="700" fill="#D9534F">Histamine</text>
  <path d="M330 296 q-40 10 -70 0" stroke="#D9534F" stroke-width="2.5" fill="none" stroke-dasharray="5 5"/>
  <text x="300" y="318" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="13" fill="#D9534F">Vessels widen → bump</text>

  <!-- 右侧三步 -->
  <g font-family="PingFang SC,Hiragino Sans GB,sans-serif">
    <rect x="384" y="90" width="228" height="58" rx="12" fill="#EEF6FF" stroke="#4EC5F1" stroke-width="2.5"/>
    <text x="498" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1C7FA8">① First, a little saliva</text>
    <text x="498" y="136" text-anchor="middle" font-size="13" fill="#4B5563">So blood will not clot its straw</text>

    <path d="M498 152 v16" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M498 170 l-7 -10 h14 z" fill="#CBD5E1"/>

    <rect x="384" y="178" width="228" height="58" rx="12" fill="#FFF0F0" stroke="#FF7A7A" stroke-width="2.5"/>
    <text x="498" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#D9534F">② Your guards arrive</text>
    <text x="498" y="224" text-anchor="middle" font-size="13" fill="#4B5563">Treating saliva as an enemy</text>

    <path d="M498 240 v16" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M498 258 l-7 -10 h14 z" fill="#CBD5E1"/>

    <rect x="384" y="266" width="228" height="58" rx="12" fill="#FFF9E6" stroke="#FFD166" stroke-width="2.5"/>
    <text x="498" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#B5730F">③ Histamine → itch</text>
    <text x="505" y="312" text-anchor="middle" font-size="13" fill="#4B5563">Scratch more, itch more</text>
  </g>
</svg>
