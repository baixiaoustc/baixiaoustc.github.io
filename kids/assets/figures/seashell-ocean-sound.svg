<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="海螺贴在耳朵上：左边风、车、人声、风扇的声波箭头钻进海螺；中间海螺剖开，空腔里的空气来回振动、低音被放大；右边声音进入耳朵，听起来像「哗——」的海浪。底部：越安静的地方「海浪」越小，它本来就是你身边的声音">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>

  <text x="320" y="46" text-anchor="middle" font-size="22" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" font-weight="700" fill="#2F3542">海螺里的“海浪”，是从哪儿来的？</text>
  <text x="320" y="78" text-anchor="middle" font-size="14" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#6B7B8A">先记住：海螺里没有存着海水的声音</text>

  <!-- 周围的声音 -->
  <text x="36" y="120" font-size="14" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#3A5A6B">周围的声音：风、车、人声、风扇…</text>

  <path d="M46,148 C105,138 165,146 228,172" fill="none" stroke="#7FA8BF" stroke-width="2"/>
  <path d="M232,176 L216,171 L220,182 Z" fill="#7FA8BF"/>
  <path d="M40,192 C100,188 160,196 234,210" fill="none" stroke="#7FA8BF" stroke-width="2"/>
  <path d="M238,214 L222,209 L226,220 Z" fill="#7FA8BF"/>
  <path d="M46,238 C105,244 165,238 228,250" fill="none" stroke="#7FA8BF" stroke-width="2"/>
  <path d="M232,254 L216,249 L220,260 Z" fill="#7FA8BF"/>

  <!-- 海螺外壳 -->
  <path d="M258,252 C242,218 252,176 292,156 C332,136 390,142 418,170 C446,200 446,244 414,268 C382,292 300,296 258,252 Z" fill="#F7E8D6" stroke="#C9A98C" stroke-width="2"/>
  <!-- 壳壁的层纹 -->
  <path d="M270,196 C282,172 312,156 348,149" fill="none" stroke="#E7CBAA" stroke-width="1.2"/>
  <path d="M262,222 C272,198 300,180 336,170" fill="none" stroke="#E7CBAA" stroke-width="1.2"/>
  <path d="M420,196 C424,220 424,244 416,266" fill="none" stroke="#E7CBAA" stroke-width="1.2"/>

  <!-- 空腔 -->
  <path d="M300,178 C274,192 264,212 268,236 C272,262 300,276 340,276 C380,276 404,262 408,236 C412,210 400,188 376,178 C352,168 324,168 300,178 Z" fill="#FFF6E2" stroke="#E3C9AC" stroke-width="1.5"/>

  <!-- 空腔里振动的空气 -->
  <path d="M286,196 q8,-9 16,0 t16,0 t16,0 t16,0 t16,0 t16,0" fill="none" stroke="#E9A23B" stroke-width="2"/>
  <path d="M286,258 q8,9 16,0 t16,0 t16,0 t16,0 t16,0 t16,0" fill="none" stroke="#E9A23B" stroke-width="2"/>
  <circle cx="282" cy="186" r="2" fill="#C8A45C"/>
  <circle cx="292" cy="250" r="2" fill="#C8A45C"/>
  <circle cx="312" cy="264" r="2" fill="#C8A45C"/>
  <circle cx="352" cy="180" r="2" fill="#C8A45C"/>
  <circle cx="376" cy="262" r="2" fill="#C8A45C"/>
  <circle cx="396" cy="196" r="2" fill="#C8A45C"/>
  <circle cx="400" cy="246" r="2" fill="#C8A45C"/>

  <text x="332" y="222" text-anchor="middle" font-size="13" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#8A6A2F">空气来回振动</text>
  <text x="332" y="244" text-anchor="middle" font-size="13" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#8A6A2F">低音被放大</text>

  <!-- 开口与声音进耳朵 -->
  <path d="M408,204 L430,196" fill="none" stroke="#C9A98C" stroke-width="1.5"/>
  <path d="M408,252 L430,260" fill="none" stroke="#C9A98C" stroke-width="1.5"/>
  <ellipse cx="434" cy="228" rx="7" ry="32" fill="#A9805F" stroke="#8A6A52" stroke-width="1"/>

  <path d="M444,228 q7,-9 14,0 t14,0 t14,0 t14,0" fill="none" stroke="#C8A45C" stroke-width="2.2"/>
  <path d="M520,228 L504,223 L504,233 Z" fill="#C8A45C"/>

  <!-- 耳朵 -->
  <ellipse cx="552" cy="226" rx="29" ry="45" fill="#F6D7C8" stroke="#D99880" stroke-width="1.5"/>
  <path d="M550,192 C534,200 527,216 530,234 C533,248 543,256 553,254" fill="none" stroke="#D99880" stroke-width="1.5"/>
  <circle cx="525" cy="228" r="4" fill="#B07A62"/>

  <text x="486" y="156" text-anchor="middle" font-size="13" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#3A5A6B">听到：哗——像海浪</text>
  <text x="552" y="298" text-anchor="middle" font-size="13" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#3A5A6B">耳朵</text>

  <!-- 底部一句 -->
  <rect x="34" y="320" width="572" height="46" rx="12" fill="#F3EAD9"/>
  <text x="320" y="349" text-anchor="middle" font-size="14" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" fill="#6B5B3E">越安静的地方，“海浪”越小——它本来就是你身边的声音</text>
</svg>
