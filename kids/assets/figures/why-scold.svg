<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="三段图解：打翻水杯是做错的那件事；大人着急是因为怕你受伤；批评的是这件事，喜欢你这件事没变">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="46" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="22" font-weight="700" fill="#2F3542">大人批评的，是那件事，不是你</text>

  <!-- ① 打翻了水杯 -->
  <rect x="30" y="74" width="180" height="176" rx="16" fill="#F7F4FE" stroke="#A78BFA" stroke-width="2.5"/>
  <line x1="44" y1="224" x2="196" y2="224" stroke="#D3CAF0" stroke-width="3" stroke-linecap="round"/>
  <!-- 小朋友 -->
  <g stroke="#B98246" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M80 194 v24"/>
    <path d="M66 204 h28"/>
    <path d="M80 218 l-8 6"/>
    <path d="M80 218 l8 6"/>
  </g>
  <circle cx="80" cy="184" r="10" fill="#FFD9A0" stroke="#B98246" stroke-width="3"/>
  <!-- 倒下的杯子 + 水 -->
  <g transform="rotate(-28 146 204)">
    <rect x="134" y="190" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#8A7FC0" stroke-width="3"/>
  </g>
  <ellipse cx="152" cy="221" rx="30" ry="6" fill="#CFC6EF"/>
  <circle cx="136" cy="214" r="3" fill="#B4A8E2"/>
  <circle cx="168" cy="212" r="2.5" fill="#B4A8E2"/>

  <!-- ② 大人着急了 -->
  <rect x="230" y="74" width="180" height="176" rx="16" fill="#F7F4FE" stroke="#A78BFA" stroke-width="2.5"/>
  <line x1="244" y1="224" x2="396" y2="224" stroke="#D3CAF0" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#8A6F4E" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M300 176 v40"/>
    <path d="M282 196 h36"/>
    <path d="M300 216 l-10 8"/>
    <path d="M300 216 l10 8"/>
  </g>
  <circle cx="300" cy="162" r="13" fill="#FFD9A0" stroke="#8A6F4E" stroke-width="3.5"/>
  <!-- 说话气泡 -->
  <rect x="322" y="96" width="72" height="40" rx="12" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2.5"/>
  <path d="M330 136 l-6 12 l14 -10 z" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="358" y="123" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#6D4FC4">不行！</text>

  <!-- ③ 喜欢你这件事没变 -->
  <rect x="430" y="74" width="180" height="176" rx="16" fill="#F7F4FE" stroke="#A78BFA" stroke-width="2.5"/>
  <line x1="444" y1="224" x2="596" y2="224" stroke="#D3CAF0" stroke-width="3" stroke-linecap="round"/>
  <!-- 大人 -->
  <g stroke="#8A6F4E" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M536 180 v38"/>
    <path d="M522 198 h28"/>
    <path d="M536 218 l-9 6"/>
    <path d="M536 218 l9 6"/>
  </g>
  <circle cx="536" cy="166" r="12" fill="#FFD9A0" stroke="#8A6F4E" stroke-width="3.5"/>
  <!-- 小朋友 -->
  <g stroke="#B98246" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M486 198 v20"/>
    <path d="M474 208 h24"/>
    <path d="M486 218 l-7 6"/>
    <path d="M486 218 l7 6"/>
  </g>
  <circle cx="486" cy="188" r="10" fill="#FFD9A0" stroke="#B98246" stroke-width="3"/>
  <!-- 摸头的手 -->
  <ellipse cx="486" cy="172" rx="14" ry="7" fill="#FFD9A0" stroke="#8A6F4E" stroke-width="3" transform="rotate(-12 486 172)"/>
  <!-- 心 -->
  <path d="M456 128 c-6 -10 -20 -6 -20 4 c0 9 13 15 20 20 c7 -5 20 -11 20 -20 c0 -10 -14 -14 -20 -4 z" fill="#F2A6BE" stroke="#D9738F" stroke-width="2.5"/>

  <!-- 分段说明 -->
  <text x="120" y="276" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#6D4FC4">① 打翻了水</text>
  <text x="120" y="300" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">做错的是这件事</text>
  <text x="120" y="322" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">它就在那儿</text>

  <text x="320" y="276" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#6D4FC4">② 大人着急了</text>
  <text x="320" y="300" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">怕你被开水烫到</text>
  <text x="320" y="322" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">声音就变大了</text>

  <text x="520" y="276" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#6D4FC4">③ 喜欢你不变</text>
  <text x="520" y="300" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">批评的是一件小事</text>
  <text x="520" y="322" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">不是你这个人</text>

  <line x1="60" y1="342" x2="580" y2="342" stroke="#E6E1D6" stroke-width="2"/>
  <text x="320" y="372" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" fill="#6B7280">下次可以问一句：为什么不可以？</text>
</svg>
