<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="U盘装的是东西，插件是给软件插上的本领插头">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="22" font-weight="700" fill="#2F3542">U 盘装的是「东西」，插件装的是「本领」</text>

  <!-- 左：U盘 -->
  <rect x="24" y="70" width="278" height="264" rx="20" fill="#F3F4F6"/>
  <text x="163" y="102" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="17" font-weight="700" fill="#4B5563">U 盘：往里装东西</text>

  <rect x="66" y="186" width="120" height="66" rx="10" fill="#9CA3AF" stroke="#6B7280" stroke-width="3"/>
  <rect x="186" y="200" width="34" height="38" rx="4" fill="#E5E7EB" stroke="#6B7280" stroke-width="3"/>
  <rect x="196" y="208" width="6" height="10" rx="3" fill="#6B7280"/>
  <rect x="208" y="208" width="6" height="10" rx="3" fill="#6B7280"/>
  <text x="126" y="228" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">32 GB</text>

  <g fill="#7FD6FF" stroke="#3B82F6" stroke-width="2">
    <rect x="86" y="132" width="26" height="22" rx="3"/>
    <rect x="118" y="132" width="26" height="22" rx="3"/>
    <rect x="150" y="132" width="26" height="22" rx="3"/>
  </g>
  <path d="M160 158 q0 14 0 22" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="5 5" fill="none"/>
  <text x="130" y="122" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#3B82F6">照片、作业、电影</text>
  <text x="163" y="296" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#4B5563">拔掉以后，东西还在盘里</text>

  <!-- 右：插件 -->
  <rect x="330" y="70" width="286" height="264" rx="20" fill="#FFF3E8"/>
  <text x="473" y="102" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="17" font-weight="700" fill="#B5730F">插件：给软件加一样本领</text>

  <!-- 软件 -->
  <rect x="386" y="170" width="176" height="110" rx="12" fill="#FFFFFF" stroke="#FFB347" stroke-width="3"/>
  <rect x="398" y="182" width="152" height="76" rx="6" fill="#FFF0DC"/>
  <rect x="404" y="166" width="34" height="10" rx="4" fill="#FFB347"/>
  <text x="474" y="226" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#B5730F">已经有的软件</text>

  <!-- 插件插头 -->
  <g>
    <rect x="446" y="120" width="56" height="30" rx="6" fill="#06D6A0" stroke="#059C77" stroke-width="3"/>
    <rect x="456" y="150" width="8" height="14" rx="3" fill="#059C77"/>
    <rect x="484" y="150" width="8" height="14" rx="3" fill="#059C77"/>
    <text x="474" y="141" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">插件</text>
  </g>
  <path d="M474 166 v10" stroke="#059C77" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M448 178 l-26 26" stroke="#059C77" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="418" y="214" text-anchor="start" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="14" fill="#059C77">插上→</text>

  <text x="473" y="304" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#4B5563">比如浏览器装了挡广告插件，就多会挡广告</text>
</svg>
