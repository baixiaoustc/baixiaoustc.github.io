<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="三行示意图：政治革命换掉的是「谁说了算」，从国王一个人定变成大家投票定；工业革命换掉的是「怎么做」，从手工一天一双鞋变成机器一天几百双；科学革命换掉的是「怎么想」，从书上说的算变成自己做实验算；底部一句：改革是在同一本书里改条款，革命是把整本书换掉">
  <rect x="0" y="0" width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" fill="#2A2A2A">革命换的不是一个人，是一整套做法</text>

  <rect x="28" y="66" width="584" height="82" rx="14" fill="#FFF5EC" stroke="#E8C79A" stroke-width="1.5"/>
  <text x="48" y="98" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="17" fill="#8A5A0B">政治革命</text>
  <text x="48" y="120" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#A8845A">换「谁说了算」</text>
  <text x="236" y="110" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6A6A6A">国王一个人定</text>
  <line x1="330" y1="105" x2="360" y2="105" stroke="#C8A45C" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M360 105 L352 100 L352 110 Z" fill="#C8A45C"/>
  <text x="372" y="110" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#8A5A0B">大家投票定</text>
  <text x="48" y="140" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#A8845A">同一块地方，规矩整本换了</text>

  <rect x="28" y="158" width="584" height="82" rx="14" fill="#EFF4FA" stroke="#AFC4DA" stroke-width="1.5"/>
  <text x="48" y="190" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="17" fill="#2F5B7D">工业革命</text>
  <text x="48" y="212" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6D8FA8">换「怎么做东西」</text>
  <text x="236" y="202" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6A6A6A">手工一天一双鞋</text>
  <line x1="330" y1="197" x2="360" y2="197" stroke="#7FA3BE" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M360 197 L352 192 L352 202 Z" fill="#7FA3BE"/>
  <text x="372" y="202" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#2F5B7D">机器一天几百双</text>
  <text x="48" y="232" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#6D8FA8">没人喊口号，是一台台机器改的</text>

  <rect x="28" y="250" width="584" height="82" rx="14" fill="#F1F7EF" stroke="#B6D3A8" stroke-width="1.5"/>
  <text x="48" y="282" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="17" fill="#4A6B33">科学革命</text>
  <text x="48" y="304" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#6E8A55">换「怎么想」</text>
  <text x="236" y="294" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6A6A6A">书上说的算</text>
  <line x1="330" y1="289" x2="360" y2="289" stroke="#8FB37C" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M360 289 L352 284 L352 294 Z" fill="#8FB37C"/>
  <text x="372" y="294" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#4A6B33">自己实验算</text>
  <text x="48" y="324" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#6E8A55">判断对错的方法变了</text>

  <line x1="48" y1="352" x2="592" y2="352" stroke="#E2DCCF" stroke-width="1.2"/>
  <text x="320" y="378" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#2A2A2A">改革＝在同一本书里改条款　｜　革命＝把整本书换掉</text>
</svg>
