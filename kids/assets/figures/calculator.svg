<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="计算器的工作链条：按键接通线路，芯片按程序计算，屏幕用七根小横条显示数字">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="46" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="22" font-weight="700" fill="#2F3542">按下 3 + 5 = 以后，机器里发生了什么</text>

  <!-- ① 键盘 -->
  <rect x="30" y="90" width="150" height="140" rx="16" fill="#FFF6E8" stroke="#FFB347" stroke-width="3"/>
  <g fill="#FFB347" opacity="0.85">
    <rect x="58" y="113" width="26" height="26" rx="6"/>
    <rect x="92" y="113" width="26" height="26" rx="6"/>
    <rect x="126" y="113" width="26" height="26" rx="6"/>
    <rect x="58" y="147" width="26" height="26" rx="6"/>
    <rect x="92" y="147" width="26" height="26" rx="6"/>
    <rect x="126" y="147" width="26" height="26" rx="6"/>
    <rect x="58" y="181" width="26" height="26" rx="6"/>
    <rect x="92" y="181" width="26" height="26" rx="6"/>
    <rect x="126" y="181" width="26" height="26" rx="6"/>
  </g>
  <rect x="92" y="147" width="26" height="26" rx="6" fill="#E8801F"/>

  <!-- 箭头 1 -->
  <path d="M190 160 h34" stroke="#C7CDD6" stroke-width="3"/>
  <path d="M224 160 l-9 -6 v12 z" fill="#C7CDD6"/>

  <!-- ② 芯片 -->
  <rect x="245" y="90" width="150" height="140" rx="16" fill="#FFFDF7" stroke="#FFB347" stroke-width="3"/>
  <g stroke="#B98246" stroke-width="3" stroke-linecap="round">
    <path d="M296 140 h-12"/><path d="M296 155 h-12"/><path d="M296 170 h-12"/><path d="M296 185 h-12"/>
    <path d="M344 140 h12"/><path d="M344 155 h12"/><path d="M344 170 h12"/><path d="M344 185 h12"/>
  </g>
  <rect x="296" y="132" width="48" height="60" rx="8" fill="#F7D9AE" stroke="#B98246" stroke-width="3"/>
  <text x="320" y="170" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" font-weight="700" fill="#8A5A22">程序</text>

  <!-- 箭头 2 -->
  <path d="M405 160 h34" stroke="#C7CDD6" stroke-width="3"/>
  <path d="M439 160 l-9 -6 v12 z" fill="#C7CDD6"/>

  <!-- ③ 屏幕 -->
  <rect x="460" y="90" width="150" height="140" rx="16" fill="#EEF7EE" stroke="#06A87A" stroke-width="3"/>
  <rect x="498" y="120" width="74" height="58" rx="8" fill="#D7EEDC" stroke="#06A87A" stroke-width="3"/>
  <text x="535" y="164" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="34" font-weight="700" fill="#0B7A57">8</text>

  <!-- 三段说明 -->
  <text x="105" y="258" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="17" font-weight="700" fill="#E8801F">① 按键</text>
  <text x="105" y="284" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">按下一格，</text>
  <text x="105" y="306" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">就接通一根线</text>

  <text x="320" y="258" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="17" font-weight="700" fill="#8A5A22">② 芯片</text>
  <text x="320" y="284" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">照早就写好的</text>
  <text x="320" y="306" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">程序，把两数相加</text>

  <text x="535" y="258" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="17" font-weight="700" fill="#0B7A57">③ 屏幕</text>
  <text x="535" y="284" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">七根小横条，</text>
  <text x="535" y="306" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">亮哪几根显示哪个数</text>

  <line x1="60" y1="336" x2="580" y2="336" stroke="#E6E1D6" stroke-width="2"/>
  <text x="320" y="366" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" fill="#6B7280">它不会思考，只是把「怎么算」提前写死在芯片里</text>
</svg>
