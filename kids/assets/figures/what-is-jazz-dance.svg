<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="三格图解：爵士舞是跟着爵士乐跳出来的舞，1920 年代美国先有即兴、切分节奏的爵士乐，人们跟着它跳就有了爵士舞；它不是一套固定动作，而是在重拍上发力、身体能分节动、还能自己加花；后来分成社交摇摆舞、舞台百老汇、街头爵士放克三支，现在舞蹈班教的多是街头这支。底部一句：爵士舞不是一首曲子，而是跟着曲子怎么动">
  <rect x="0" y="0" width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" fill="#2C2A26">爵士舞：跟着爵士乐跳出来的舞</text>

  <!-- ① 先有曲子，才有舞 -->
  <rect x="32" y="70" width="176" height="250" rx="12" fill="#F4EFE3" stroke="#D8CDB8"/>
  <text x="46" y="96" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#8A6B2F">① 先有曲子，才有舞</text>
  <text x="120" y="126" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">1920 年代 · 美国</text>
  <rect x="60" y="136" width="120" height="34" rx="8" fill="#FFFDF7" stroke="#8A6B2F" stroke-width="1.5"/>
  <text x="120" y="159" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2C2A26">爵士乐</text>
  <text x="120" y="188" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C564B">即兴 · 切分节奏</text>
  <path d="M120 196 L120 208 L114 202 M120 208 L126 202" fill="none" stroke="#8A6B2F" stroke-width="2"/>
  <text x="120" y="234" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#2C2A26">大家跟着它跳</text>
  <text x="120" y="260" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#8A6B2F">就叫爵士舞</text>
  <text x="120" y="298" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C564B">爵士乐 ≠ 爵士舞</text>

  <!-- ② 不是一套固定动作 -->
  <rect x="232" y="70" width="176" height="250" rx="12" fill="#F4EFE3" stroke="#D8CDB8"/>
  <text x="246" y="96" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#8A6B2F">② 不是一套固定动作</text>
  <rect x="252" y="130" width="12" height="20" fill="#E4D9C4"/>
  <rect x="282" y="118" width="12" height="32" fill="#8A6B2F"/>
  <rect x="312" y="130" width="12" height="20" fill="#E4D9C4"/>
  <rect x="342" y="118" width="12" height="32" fill="#8A6B2F"/>
  <line x1="248" y1="162" x2="390" y2="162" stroke="#D8CDB8" stroke-width="1.5"/>
  <text x="258" y="180" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5C564B">1</text>
  <text x="288" y="180" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#8A6B2F">2</text>
  <text x="318" y="180" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5C564B">3</text>
  <text x="348" y="180" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#8A6B2F">4</text>
  <text x="320" y="204" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#2C2A26">重拍上「砸」下去发力</text>
  <text x="320" y="230" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#2C2A26">身体能分节动</text>
  <text x="320" y="256" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#2C2A26">还能自己加花</text>
  <text x="320" y="298" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C564B">同一首歌，两人两样</text>

  <!-- ③ 后来分成三支 -->
  <rect x="432" y="70" width="176" height="250" rx="12" fill="#F4EFE3" stroke="#D8CDB8"/>
  <text x="446" y="96" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#8A6B2F">③ 后来分成三支</text>
  <rect x="452" y="112" width="136" height="42" rx="8" fill="#FFFDF7" stroke="#C8A45C"/>
  <text x="520" y="138" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#2C2A26">社交 · 摇摆舞</text>
  <rect x="452" y="166" width="136" height="42" rx="8" fill="#FFFDF7" stroke="#C8A45C"/>
  <text x="520" y="192" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#2C2A26">舞台 · 百老汇</text>
  <rect x="452" y="220" width="136" height="42" rx="8" fill="#FFFDF7" stroke="#C8A45C"/>
  <text x="520" y="246" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#2C2A26">街头 · 爵士放克</text>
  <text x="520" y="298" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C564B">现在舞蹈班多是这支</text>

  <text x="320" y="356" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#2C2A26">爵士舞不是一首曲子，是「跟着曲子怎么动」</text>
  <text x="320" y="380" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#8A6B2F">没有固定组合——同一首歌，两个人能跳出两个样子</text>
</svg>
