<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="从前的玩具是铁环、毽子、沙包，现在是一块平板">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="22" font-weight="700" fill="#2F3542">爸爸妈妈小时候的玩具：动手做 + 出门跑</text>

  <rect x="24" y="72" width="290" height="270" rx="20" fill="#FFF4E0"/>
  <rect x="330" y="72" width="286" height="270" rx="20" fill="#EEF6FF"/>
  <text x="169" y="104" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="18" font-weight="700" fill="#C87A47">厂院子里、院子里</text>
  <text x="473" y="104" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="18" font-weight="700" fill="#3B82F6">现在</text>

  <!-- 铁环 -->
  <circle cx="82" cy="186" r="36" fill="none" stroke="#9CA3AF" stroke-width="7"/>
  <path d="M118 186 q22 -6 26 -26" fill="none" stroke="#B08968" stroke-width="5" stroke-linecap="round"/>
  <text x="82" y="256" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">滚铁环</text>

  <!-- 毽子 -->
  <path d="M164 178 l-14 -34 l12 4 l10 -26 l10 26 l12 -4 l-14 34 z" fill="#06D6A0" stroke="#059C77" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="164" cy="186" rx="17" ry="8" fill="#FF7A7A" stroke="#D9534F" stroke-width="3"/>
  <text x="164" y="256" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">踢毽子</text>

  <!-- 沙包 -->
  <g transform="rotate(-12 250 168)">
    <rect x="228" y="146" width="44" height="44" rx="6" fill="#FFD166" stroke="#E0A800" stroke-width="3"/>
    <path d="M228 168 h44 M250 146 v44" stroke="#E0A800" stroke-width="2.5" stroke-dasharray="4 4"/>
  </g>
  <text x="250" y="256" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">丢沙包</text>

  <text x="169" y="300" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#8A6A45">便宜、能自己做、要出门找伙伴</text>

  <!-- 平板 -->
  <rect x="386" y="132" width="174" height="120" rx="14" fill="#2F3542"/>
  <rect x="398" y="144" width="150" height="96" rx="8" fill="#7FD6FF"/>
  <path d="M462 176 l34 16 l-34 16 z" fill="#FFFFFF" opacity="0.9"/>
  <rect x="440" y="258" width="66" height="7" rx="3.5" fill="#4B5563"/>
  <text x="473" y="300" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#3B82F6">一个人、一块屏幕、随时能玩</text>
</svg>
