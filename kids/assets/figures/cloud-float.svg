<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="三段图解：云是无数极小的水珠，一点点上升的风就托得住；人是一整块大东西，风托不动；人想飞要靠机翼推空气或靠比空气轻的热气球">
  <rect width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="46" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="22" font-weight="700" fill="#2F3542">小水珠会飘，人只会往下掉</text>

  <!-- ① 云：无数小水珠 + 上升的风 -->
  <rect x="30" y="74" width="180" height="176" rx="16" fill="#EFFBF5" stroke="#06D6A0" stroke-width="2.5"/>
  <path d="M78 158 q0 -22 22 -22 q4 -20 22 -20 q18 0 24 20 q20 0 20 22 q0 12 -14 12 h-60 q-14 0 -14 -12 z" fill="#FFFFFF" stroke="#7FC6A8" stroke-width="3"/>
  <!-- 掉得很慢的小水珠 -->
  <g fill="#5FB4D8">
    <circle cx="100" cy="186" r="3"/>
    <circle cx="120" cy="200" r="3"/>
    <circle cx="140" cy="186" r="3"/>
  </g>
  <!-- 上升的风：把它们顶回去 -->
  <g stroke="#06D6A0" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M80 238 v-22"/>
    <path d="M120 238 v-16"/>
    <path d="M160 238 v-22"/>
  </g>
  <path d="M80 209 l-5 8 h10 z" fill="#06D6A0"/>
  <path d="M120 215 l-5 8 h10 z" fill="#06D6A0"/>
  <path d="M160 209 l-5 8 h10 z" fill="#06D6A0"/>
  <text x="196" y="248" text-anchor="end" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="12" fill="#0F8C68">上升的风</text>

  <!-- ② 人：一整块，往下掉 -->
  <rect x="230" y="74" width="180" height="176" rx="16" fill="#EFFBF5" stroke="#06D6A0" stroke-width="2.5"/>
  <circle cx="308" cy="116" r="13" fill="#FFFFFF" stroke="#7FC6A8" stroke-width="3"/>
  <path d="M296 136 h24 v46 h-24 z" fill="#FFFFFF" stroke="#7FC6A8" stroke-width="3" stroke-linejoin="round"/>
  <line x1="296" y1="146" x2="278" y2="166" stroke="#7FC6A8" stroke-width="3" stroke-linecap="round"/>
  <line x1="320" y1="146" x2="338" y2="166" stroke="#7FC6A8" stroke-width="3" stroke-linecap="round"/>
  <line x1="302" y1="182" x2="300" y2="208" stroke="#7FC6A8" stroke-width="3" stroke-linecap="round"/>
  <line x1="314" y1="182" x2="316" y2="208" stroke="#7FC6A8" stroke-width="3" stroke-linecap="round"/>
  <!-- 下落箭头 -->
  <path d="M370 104 v96" stroke="#E4655F" stroke-width="3" stroke-linecap="round"/>
  <path d="M370 208 l-6 -9 h12 z" fill="#E4655F"/>
  <text x="392" y="160" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="12" fill="#C2453F">几十公斤</text>
  <text x="392" y="176" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="12" fill="#C2453F">风托不住</text>

  <!-- ③ 人想飞：机翼 / 热气球 -->
  <rect x="430" y="74" width="180" height="176" rx="16" fill="#EFFBF5" stroke="#06D6A0" stroke-width="2.5"/>
  <!-- 机翼把空气往下推 -->
  <path d="M448 118 q30 -10 56 -6 l4 8 q-30 6 -56 12 z" fill="#FFFFFF" stroke="#7FC6A8" stroke-width="3"/>
  <line x1="476" y1="132" x2="476" y2="160" stroke="#5FB4D8" stroke-width="3" stroke-linecap="round"/>
  <path d="M476 168 l-6 -9 h12 z" fill="#5FB4D8"/>
  <text x="446" y="186" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="12" fill="#3D8FB0">往下推空气</text>
  <!-- 热气球 -->
  <circle cx="552" cy="118" r="20" fill="#FFF0E0" stroke="#E0A46A" stroke-width="3"/>
  <line x1="544" y1="138" x2="542" y2="152" stroke="#C98A52" stroke-width="2"/>
  <line x1="560" y1="138" x2="562" y2="152" stroke="#C98A52" stroke-width="2"/>
  <rect x="538" y="152" width="26" height="14" rx="3" fill="#FFFFFF" stroke="#E0A46A" stroke-width="2.5"/>
  <text x="552" y="186" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="12" fill="#B57A43">比空气轻</text>

  <!-- 分段说明 -->
  <text x="120" y="276" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#0F8C68">① 云是无数小水珠</text>
  <text x="120" y="300" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">每颗只有头发丝的几分之一</text>
  <text x="120" y="322" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">掉得比灰尘还慢</text>

  <text x="320" y="276" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#0F8C68">② 人是一整块</text>
  <text x="320" y="300" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">再大的风也托不住</text>
  <text x="320" y="322" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">只会一直往下掉</text>

  <text x="520" y="276" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" font-weight="700" fill="#0F8C68">③ 想飞得换个办法</text>
  <text x="520" y="300" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">翅膀把空气往下推</text>
  <text x="520" y="322" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="15" fill="#6B7280">或者像热气球，比空气轻</text>

  <line x1="60" y1="342" x2="580" y2="342" stroke="#E6E1D6" stroke-width="2"/>
  <text x="320" y="372" text-anchor="middle" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="16" fill="#6B7280">关键不是「轻」，是「摊得开」：同样重量，越小、迎风面越大，风越托得住</text>
</svg>
