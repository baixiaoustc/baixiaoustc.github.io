<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="流程图：家里和小区里要扔的旧纸箱、空瓶子、旧家电，收废品的人按很低的价按斤收走，再按纸、塑料、金属分开，压成一大包，按吨卖给造纸厂、塑料厂、铝厂和钢厂；他赚的是收进价和卖出价之间的差价，靠的是把很多家的一点点攒成一大车">
  <rect x="0" y="0" width="640" height="400" rx="24" fill="#FFFDF7"/>
  <text x="320" y="44" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" fill="#2A2A2A">他赚的是「把散的攒成一堆」的钱</text>

  <rect x="28" y="104" width="150" height="150" rx="14" fill="#EAF1FF" stroke="#B7CFE8" stroke-width="1.5"/>
  <text x="103" y="132" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="17" fill="#1F4E79">家里 · 小区</text>
  <text x="103" y="162" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#5C7691">旧纸箱</text>
  <text x="103" y="184" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#5C7691">空瓶子</text>
  <text x="103" y="206" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#5C7691">旧家电</text>
  <text x="103" y="238" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#7A93AD">在你手里：想扔</text>

  <path d="M182 179 L214 179 L207 173 M214 179 L207 185" fill="none" stroke="#5C7691" stroke-width="2"/>
  <text x="198" y="203" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#5C7691">按斤收</text>

  <rect x="222" y="88" width="196" height="180" rx="14" fill="#FFF1D6" stroke="#E8C97A" stroke-width="1.5"/>
  <text x="320" y="118" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="18" fill="#8A5A0B">收废品的人</text>
  <text x="320" y="148" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6B5320">① 按斤、很低的价收</text>
  <text x="320" y="172" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6B5320">② 分开：纸 / 塑料 / 金属</text>
  <text x="320" y="196" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6B5320">③ 压成一大包</text>
  <text x="320" y="228" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#9A7B3A">混在一起没人要</text>
  <text x="320" y="250" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#9A7B3A">分开了才有工厂要</text>

  <path d="M422 179 L448 124 L444 132 M448 124 L447 133" fill="none" stroke="#6B5320" stroke-width="2"/>
  <path d="M422 179 L448 202 L443 195 M448 202 L443 196" fill="none" stroke="#6B5320" stroke-width="2"/>
  <path d="M422 179 L448 280 L442 273 M448 280 L442 274" fill="none" stroke="#6B5320" stroke-width="2"/>
  <text x="434" y="212" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#8A5A0B">按吨卖</text>

  <rect x="456" y="92" width="150" height="64" rx="12" fill="#E8F3E6" stroke="#B5D3B0" stroke-width="1.5"/>
  <text x="531" y="118" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#2F6B34">造纸厂</text>
  <text x="531" y="140" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#4F7A52">废纸打成浆，做新纸箱</text>

  <rect x="456" y="170" width="150" height="64" rx="12" fill="#FDE8E8" stroke="#E8B4B4" stroke-width="1.5"/>
  <text x="531" y="196" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#8C2F2F">塑料厂</text>
  <text x="531" y="218" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#8C5A5A">熔成小颗粒，做桶和衣架</text>

  <rect x="456" y="248" width="150" height="64" rx="12" fill="#EDE9FE" stroke="#C4BCEB" stroke-width="1.5"/>
  <text x="531" y="274" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#4B3F8A">铝厂 · 钢厂</text>
  <text x="531" y="296" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#6A60A8">回炉变成铝锭、钢筋</text>

  <text x="320" y="332" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#2A2A2A">差价 = 卖掉的钱 − 收进的钱</text>
  <text x="320" y="358" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#6A6A6A">不是秤上占便宜，是把几十家的「一点点」攒成了一大车</text>
</svg>
