<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小问号博物馆 · 玉米和桃子的问题</title>
<meta name="description" content="记录玉米和桃子每天提出的问题，按学科分好，每个问题配一张一眼看懂的图。">
<link rel="icon" type="image/svg+xml" href="assets/figures/logo.svg">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="index">

<header class="hero">
  <div class="wrap">
    <h1>小问号博物馆</h1>
    <p class="sub">玉米和桃子问过的每一个问题，都收在这里。一张图看懂，三句话说清。</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<section class="filters">
  <div class="wrap">
    <div class="search-row">
      <input id="search" type="search" placeholder="搜一搜：螃蟹、蚊子、插件、保险…" autocomplete="off">
      <button id="viewToggle" class="view-toggle" type="button">按时间</button>
    </div>
    <div class="chips" id="kidChips"></div>
    <div class="chips" id="subjectChips"></div>
  </div>
</section>

<main class="wrap">
  <div id="board"></div>
</main>

<footer>
  <div class="wrap">
    问题来自玉米和桃子，答案由爸爸整理 · 每个问题配一张手绘的图
  </div>
</footer>

<script src="data/questions.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
