<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
<title>学习笔记｜STUDY NOTES</title>
<meta name="description" content="读书笔记的可视化站点：一本一本书读下去，每章一个独立页面。">
<meta name="theme-color" content="#0E2233">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E2233'/%3E%3Cpath d='M16 6 L26 16 L16 26 L6 16 Z' fill='none' stroke='%23C8A45C' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23C8A45C'/%3E%3C/svg%3E">
<style>
  :root{
    --ink-0:#08151F; --ink-1:#102435;
    --line:rgba(242,245,247,.14); --line-soft:rgba(242,245,247,.07);
    --text:#E9EEF2; --dim:#8FA2B2; --dimmer:#7A8D9E;
    --gold:#C8A45C; --gold-dim:#8C7139;
    --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--ink-0);color:var(--text);
    font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(rgba(242,245,247,.028) 1px,transparent 1px),
                      linear-gradient(90deg,rgba(242,245,247,.028) 1px,transparent 1px);
    background-size:34px 34px;
  }
  .wrap{max-width:880px;margin:0 auto;padding:76px 24px 56px}
  .mono{font-family:var(--mono);letter-spacing:.04em}
  .meta{display:flex;flex-wrap:wrap;gap:16px;font-size:10px;letter-spacing:.16em;color:var(--dimmer);text-transform:uppercase}
  .meta span+span::before{content:"/";margin-right:16px;color:var(--gold-dim)}
  h1{font-size:clamp(30px,5.4vw,44px);line-height:1.2;margin:26px 0 12px;font-weight:600}
  .sub{color:var(--dim);font-size:15px;margin:0 0 40px;max-width:640px}
  .list{border:1px solid var(--line);background:linear-gradient(180deg,var(--ink-1),rgba(10,25,37,.5))}
  .row{display:grid;grid-template-columns:56px 1fr 132px 30px;gap:16px;align-items:center;
       padding:22px;border-bottom:1px solid var(--line-soft);text-decoration:none;color:inherit;transition:.2s}
  .row:last-child{border-bottom:0}
  .row:hover{background:rgba(200,164,92,.07)}
  .row .no{font-size:10px;letter-spacing:.18em;color:var(--gold-dim)}
  .row .t{font-size:18px;font-weight:600}
  .row .d{font-size:11.5px;color:var(--dimmer);margin-top:3px;letter-spacing:.02em}
  .row .tag{font-size:10px;letter-spacing:.08em;color:var(--gold);text-align:right;line-height:1.6}
  .row .go{color:var(--gold);text-align:center;font-size:14px}
  .row.soon{opacity:.55;cursor:default}
  .row.soon:hover{background:none}
  .row.soon .tag{color:var(--dimmer)}
  .note{margin-top:20px;padding:14px 18px;border-left:2px solid var(--gold-dim);
        background:rgba(200,164,92,.045);color:var(--dim);font-size:12.5px;line-height:1.8}
  .note b{color:var(--text)}
  footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line-soft);
         display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;
         font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--dimmer)}
  footer a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold-dim)}
  @media(max-width:640px){
    .wrap{padding:52px 18px 40px}
    .row{grid-template-columns:40px 1fr 24px;gap:10px;padding:16px}
    .row .tag{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="meta mono"><span>STUDY NOTES</span><span>可视化读书笔记</span></div>
  <h1>学习笔记</h1>
  <p class="sub">一本一本书读下去。每章一个独立页面，静态部分写清概念，动态部分只服务于这一章最难理解的那件事。</p>

  <div class="list">
    <a class="row" href="payment-primer/">
      <span class="no mono">BOOK 01</span>
      <div>
        <div class="t">一本书读懂支付</div>
        <div class="d">陈斌 · 支付 / 结算 / 清算 / 资金安全风险敞口</div>
      </div>
      <span class="tag">3 章已上线<br>24 个动效</span>
      <span class="go">↗</span>
    </a>
    <div class="row soon">
      <span class="no mono">BOOK 02</span>
      <div>
        <div class="t">下一本待定</div>
        <div class="d">读完再拆，不提前造目录</div>
      </div>
      <span class="tag">未上线</span>
      <span class="go">·</span>
    </div>
  </div>

  <div class="note">每本书有自己的章节路径：<b>notes/&lt;book&gt;/chNN/</b>。加新书时只新建一个目录，不动已有章节的地址。</div>

  <footer>
    <span>STUDY NOTES · INDEX</span>
    <a href="https://book.douban.com/subject/36422205/" target="_blank" rel="noopener">豆瓣 · 一本书读懂支付 ↗</a>
  </footer>
</div>
</body>
</html>
