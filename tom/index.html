<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FDF6E3">
<title>快递员汤姆 · 小游戏</title>
<style>
  :root{
    --paper:#FDF6E3; --ink:#22333B; --muted:#6B7A80;
    --road:#E4DAC4; --road-line:#C3B79C; --block:#EDE4CF;
    --orange:#E8853A; --gold:#D9A441; --green:#5B9A78; --red:#C4574A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 50% -10%, #FFFDF7, rgba(255,253,247,0) 70%),
      var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 14px 28px;
  }
  .page{width:100%;max-width:780px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
  .title-wrap h1{margin:0;font-size:clamp(22px,4.6vw,34px);letter-spacing:.02em}
  .title-wrap h1 span{color:var(--orange)}
  .title-wrap p{margin:6px 0 0;font-size:clamp(12px,2.4vw,14px);color:var(--muted);line-height:1.6}
  .back-link{font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px dashed var(--road-line);padding:10px 2px;white-space:nowrap;display:inline-block}
  .back-link:hover{color:var(--ink)}

  .hud{display:flex;gap:8px;margin:12px 0 10px;flex-wrap:wrap}
  .pill{flex:1 1 90px;background:#FFFDF7;border:1px solid #E2D7BE;border-radius:12px;padding:8px 12px;min-width:88px}
  .pill .k{display:block;font-size:9px;letter-spacing:.14em;color:#9A8F76;text-transform:uppercase}
  .pill .v{display:block;font-size:clamp(17px,3.4vw,22px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
  .pill.time .v{color:var(--red)}
  .pill.best .v{color:var(--green)}
  .pill.orders .v{color:var(--orange)}

  .stage{position:relative;width:100%;border-radius:18px;overflow:hidden;
    border:1px solid #D8CCB1;background:var(--paper);
    box-shadow:0 14px 30px -18px rgba(34,51,59,.45), 0 2px 0 #EFE6D1 inset}
  canvas{display:block;width:100%;height:auto;aspect-ratio:728/520;touch-action:none}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:22px;background:rgba(253,246,227,.92);backdrop-filter:blur(2px)}
  .overlay.hidden{display:none}
  .overlay .big{font-size:clamp(24px,5vw,34px);font-weight:800;margin:0 0 6px}
  .overlay .sub{font-size:clamp(12px,2.4vw,14px);color:var(--muted);line-height:1.7;max-width:420px;margin:0 0 14px}
  .overlay .sub b{color:var(--ink)}
  .btn{cursor:pointer;border:0;border-radius:999px;padding:12px 26px;font-size:clamp(15px,3vw,17px);font-weight:700;
    background:var(--orange);color:#fff;box-shadow:0 4px 0 #B86422;transition:transform .08s ease,box-shadow .08s ease}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #B86422}
  .btn.ghost{background:#FFFDF7;color:var(--ink);border:1px solid #D8CCB1;box-shadow:0 3px 0 #E2D7BE}
  .over-score{font-size:clamp(26px,5vw,36px);font-weight:800;color:var(--orange);margin:2px 0 4px}
  .over-best{font-size:12px;color:var(--muted);margin:0 0 14px}

  .pad-wrap{display:none;margin:12px auto 0;width:168px;position:relative;height:168px}
  .pad{position:absolute;width:54px;height:54px;border-radius:14px;border:1px solid #D8CCB1;background:#FFFDF7;
    color:var(--ink);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 0 #E4D9C2;user-select:none;-webkit-user-select:none;touch-action:none}
  .pad:active,.pad.on{background:#F4E7CF;box-shadow:0 1px 0 #E4D9C2;transform:translateY(2px)}
  .pad.up{left:57px;top:0}.pad.down{left:57px;bottom:0}.pad.left{left:0;top:57px}.pad.right{right:0;top:57px}
  .pad-mid{position:absolute;left:57px;top:57px;width:54px;height:54px;border-radius:50%;
    border:1px dashed #D8CCB1;background:rgba(255,253,247,.6);display:flex;align-items:center;justify-content:center;font-size:18px;color:#A99B7C}

  .foot{margin-top:14px;font-size:11px;color:#9A8F76;line-height:1.7}
  .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-8px);opacity:0;
    background:#22333B;color:#FFFDF7;font-size:12px;padding:6px 12px;border-radius:999px;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (pointer:coarse), (max-width:700px){
    .pad-wrap{display:block}
  }
  @media (max-width:520px){
    body{padding:14px 10px 22px}
    .hud{gap:6px}
    .pill{padding:6px 9px;border-radius:10px}
    .overlay{padding:16px}
    .overlay .sub{font-size:12px}
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="title-wrap">
      <h1>🛵 快递员<span>汤姆</span></h1>
      <p>先取包裹，再送到闪光的房子。60 秒内能送几单？</p>
    </div>
    <a class="back-link" href="../">← 回到博客</a>
  </header>

  <div class="hud" aria-live="polite">
    <div class="pill"><span class="k">得分</span><span class="v" id="scoreV">0</span></div>
    <div class="pill orders"><span class="k">已送达</span><span class="v" id="ordersV">0</span></div>
    <div class="pill time"><span class="k">剩余时间</span><span class="v" id="timeV">60</span></div>
    <div class="pill best"><span class="k">最高分</span><span class="v" id="bestV">0</span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="728" height="520" aria-label="快递员汤姆的游戏画面"></canvas>

    <div class="overlay" id="intro">
      <p class="big">汤姆今天值班 🛵</p>
      <p class="sub">用 <b>方向键 / WASD</b> 移动，手机用下方方向盘。<br>先碰到<b>包裹</b>再送往<b>闪光的房子</b>，每送达一单加 3 秒。</p>
      <button class="btn" id="startBtn" type="button">开始派送</button>
    </div>

    <div class="overlay hidden" id="over">
      <p class="big">派送结束</p>
      <p class="over-score" id="finalScore">0 分</p>
      <p class="over-best" id="finalBest">本局送达 0 单</p>
      <button class="btn" id="againBtn" type="button">再来一单</button>
    </div>

    <div class="toast" id="toast">+1 单</div>
  </div>

  <div class="pad-wrap" id="padWrap" aria-label="移动方向盘">
    <button class="pad up" data-dir="up" type="button" aria-label="上">▲</button>
    <button class="pad down" data-dir="down" type="button" aria-label="下">▼</button>
    <button class="pad left" data-dir="left" type="button" aria-label="左">◀</button>
    <button class="pad right" data-dir="right" type="button" aria-label="右">▶</button>
    <div class="pad-mid">🛵</div>
  </div>

  <p class="foot">小提示：房子会发光，跟着光走就不容易迷路。连续送达会越来越快。</p>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 728, H = 520;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const $ = (id) => document.getElementById(id);
  const scoreV = $('scoreV'), ordersV = $('ordersV'), timeV = $('timeV'), bestV = $('bestV');
  const intro = $('intro'), over = $('over'), finalScore = $('finalScore'), finalBest = $('finalBest');
  const toast = $('toast');

  const HOUSES = [
    { x: 96,  y: 104, color: '#C4574A', name: '红房子' },
    { x: 364, y: 82,  color: '#5B7FA6', name: '蓝房子' },
    { x: 636, y: 118, color: '#5B9A78', name: '绿房子' },
    { x: 112, y: 424, color: '#8E6B9E', name: '紫房子' },
    { x: 364, y: 446, color: '#4F9A9A', name: '青房子' },
    { x: 624, y: 418, color: '#D97B8C', name: '粉房子' },
  ];
  const SPOTS = [
    {x:250,y:236},{x:480,y:250},{x:196,y:326},{x:548,y:330},{x:360,y:300},
    {x:300,y:174},{x:452,y:392},{x:602,y:262},{x:150,y:252},{x:408,y:232},
  ];

  const state = {
    screen: 'intro',
    score: 0, orders: 0, time: 60,
    player: {x: 364, y: 268, r: 16, dirX: 0, dirY: -1},
    package: null, house: null, carried: false,
    speed: 172, deliveries: 0,
    t: 0, particles: [], flash: 0
  };
  let best = 0;
  try { best = Number(localStorage.getItem('tom-best') || 0) || 0; } catch (e) { best = 0; }
  bestV.textContent = best;

  const keys = { up:false, down:false, left:false, right:false };

  function reset() {
    state.score = 0; state.orders = 0; state.time = 60; state.carried = false;
    state.speed = 172; state.deliveries = 0; state.particles = []; state.flash = 0;
    state.player.x = 364; state.player.y = 268; state.player.dirX = 0; state.player.dirY = -1;
    state.screen = 'playing';
    spawnOrder();
    intro.classList.add('hidden');
    over.classList.add('hidden');
    updateHud();
  }

  function spawnOrder() {
    const p = SPOTS[Math.floor(Math.random() * SPOTS.length)];
    state.package = { x: p.x, y: p.y, r: 13 };
    const far = HOUSES.filter(h => Math.hypot(h.x - p.x, h.y - p.y) > 170);
    const pool = far.length ? far : HOUSES;
    state.house = pool[Math.floor(Math.random() * pool.length)];
    state.carried = false;
  }

  function start() {
    reset();
  }

  function gameOver() {
    state.screen = 'over';
    if (state.score > best) {
      best = state.score;
      try { localStorage.setItem('tom-best', String(best)); } catch (e) {}
    }
    bestV.textContent = best;
    finalScore.textContent = state.score + ' 分';
    finalBest.textContent = '本局送达 ' + state.orders + ' 单 · 最高分 ' + best;
    over.classList.remove('hidden');
  }

  function updateHud() {
    scoreV.textContent = state.score;
    ordersV.textContent = state.orders;
    timeV.textContent = Math.ceil(Math.max(0, state.time));
    bestV.textContent = best;
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 900);
  }

  function pushParticles(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 130;
      state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, color });
    }
  }

  function update(dt) {
    state.t += dt;
    if (state.screen !== 'playing') return;

    const p = state.player;
    let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    let dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (dx && dy) { const k = Math.SQRT1_2; dx *= k; dy *= k; }
    if (dx || dy) { p.dirX = dx; p.dirY = dy; }

    const sp = state.speed * (state.carried ? 0.92 : 1);
    p.x = Math.max(26, Math.min(W - 26, p.x + dx * sp * dt));
    p.y = Math.max(26, Math.min(H - 26, p.y + dy * sp * dt));

    state.flash = Math.max(0, state.flash - dt * 3);

    // 取包裹
    if (!state.carried && state.package && Math.hypot(p.x - state.package.x, p.y - state.package.y) < p.r + state.package.r + 6) {
      state.carried = true;
      pushParticles(state.package.x, state.package.y, '#D9A441');
      state.package = null;
      showToast('包裹到手，出发 🏠');
    }

    // 送达
    if (state.carried && state.house && Math.hypot(p.x - state.house.x, p.y - state.house.y) < 40) {
      state.score += 100;
      state.orders += 1;
      state.deliveries += 1;
      state.time = Math.min(99, state.time + 3);
      state.flash = 1;
      pushParticles(state.house.x, state.house.y, state.house.color);
      showToast('+1 单 · +3 秒');
      if (state.deliveries % 3 === 0) state.speed = Math.min(270, state.speed + 14);
      spawnOrder();
      updateHud();
    }

    state.time -= dt;
    if (state.time <= 0) { state.time = 0; updateHud(); gameOver(); }
    else updateHud();

    // 粒子
    for (const q of state.particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .92; q.vy *= .92; q.life -= dt; }
    state.particles = state.particles.filter(q => q.life > 0);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawMap() {
    ctx.fillStyle = '#FDF6E3'; ctx.fillRect(0, 0, W, H);

    // 街区
    ctx.fillStyle = '#EDE4CF';
    roundRect(28, 28, 180, 150, 16); ctx.fill();
    roundRect(260, 22, 208, 120, 16); ctx.fill();
    roundRect(520, 30, 180, 170, 16); ctx.fill();
    roundRect(30, 340, 190, 150, 16); ctx.fill();
    roundRect(260, 382, 208, 116, 16); ctx.fill();
    roundRect(520, 330, 180, 160, 16); ctx.fill();

    // 路面
    ctx.fillStyle = '#E4DAC4';
    ctx.fillRect(0, 190, W, 34); ctx.fillRect(0, 296, W, 34);
    ctx.fillRect(220, 0, 34, H); ctx.fillRect(474, 0, 34, H);

    // 道路中缝
    ctx.strokeStyle = '#C3B79C'; ctx.lineWidth = 2; ctx.setLineDash([14, 12]);
    for (const y of [207, 313]) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    for (const x of [237, 491]) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    ctx.setLineDash([]);

    // 小窗户
    ctx.fillStyle = 'rgba(34,51,59,.10)';
    for (const [bx, by, bw, bh] of [[50,52,44,10],[50,78,44,10],[298,48,54,10],[298,74,54,10],[548,62,44,10],[548,88,44,10],[52,372,44,10],[300,410,52,10],[546,360,44,10]]) {
      ctx.fillRect(bx, by, bw, bh);
    }

    // 草地点缀
    ctx.fillStyle = 'rgba(91,154,120,.18)';
    for (const [gx, gy] of [[226,160],[500,174],[226,406],[500,468],[660,260]]) {
      ctx.beginPath(); ctx.arc(gx, gy, 9, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawHouse(h, active) {
    const t = state.t;
    if (active) {
      const pulse = 1 + Math.sin(t * 5) * .08;
      ctx.strokeStyle = 'rgba(217,164,65,.75)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(h.x, h.y + 4, 34 * pulse, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(217,164,65,.10)';
      ctx.beginPath(); ctx.arc(h.x, h.y + 4, 34 * pulse, 0, Math.PI * 2); ctx.fill();
    }
    // 房身
    ctx.fillStyle = h.color;
    roundRect(h.x - 22, h.y - 8, 44, 34, 6); ctx.fill();
    // 屋顶
    ctx.fillStyle = '#22333B';
    ctx.beginPath(); ctx.moveTo(h.x - 28, h.y - 8); ctx.lineTo(h.x, h.y - 30); ctx.lineTo(h.x + 28, h.y - 8); ctx.closePath(); ctx.fill();
    // 门
    ctx.fillStyle = '#FFFDF7';
    roundRect(h.x - 7, h.y + 6, 14, 20, 3); ctx.fill();
    // 窗
    ctx.fillStyle = 'rgba(255,253,247,.85)';
    ctx.fillRect(h.x + 8, h.y + 1, 8, 8);
    // 邮箱
    ctx.fillStyle = '#22333B';
    ctx.fillRect(h.x - 32, h.y + 12, 6, 12);
    ctx.fillStyle = h.color;
    ctx.fillRect(h.x - 36, h.y + 8, 14, 7);
  }

  function drawPackage(p) {
    const bob = Math.sin(state.t * 4) * 2;
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.fillStyle = 'rgba(34,51,59,.14)';
    ctx.beginPath(); ctx.ellipse(0, 15, 14, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#C99A5B';
    roundRect(-14, -12, 28, 24, 4); ctx.fill();
    ctx.fillStyle = '#E8C98F';
    ctx.fillRect(-14, -4, 28, 6);
    ctx.fillStyle = '#8A6B2F';
    ctx.fillRect(-3, -12, 6, 24);
    ctx.restore();
  }

  function drawPlayer(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    // 影子
    ctx.fillStyle = 'rgba(34,51,59,.16)';
    ctx.beginPath(); ctx.ellipse(0, 14, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
    // 车轮
    ctx.fillStyle = '#22333B';
    ctx.beginPath(); ctx.arc(-10, 9, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, 9, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8A6B2F';
    ctx.beginPath(); ctx.arc(-10, 9, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, 9, 2, 0, Math.PI * 2); ctx.fill();
    // 车身
    ctx.fillStyle = '#E8853A';
    roundRect(-13, -6, 26, 14, 6); ctx.fill();
    // 快递箱
    ctx.fillStyle = '#C99A5B';
    roundRect(-11, -20, 18, 15, 3); ctx.fill();
    ctx.fillStyle = '#8A6B2F';
    ctx.fillRect(-11, -15, 18, 3);
    // 头
    ctx.fillStyle = '#F2C79E';
    ctx.beginPath(); ctx.arc(2, -17, 8, 0, Math.PI * 2); ctx.fill();
    // 头盔
    ctx.fillStyle = '#FFFDF7';
    ctx.beginPath(); ctx.arc(2, -18, 9, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#E8853A';
    ctx.beginPath(); ctx.arc(2, -18, 9, Math.PI * 1.05, Math.PI * 1.55); ctx.fill();
    // 朝向小箭头
    const len = Math.hypot(p.dirX, p.dirY) || 1;
    const ux = p.dirX / len, uy = p.dirY / len;
    ctx.fillStyle = 'rgba(34,51,59,.55)';
    ctx.beginPath();
    ctx.moveTo(ux * 22, uy * 22);
    ctx.lineTo(-uy * 5 + ux * 15, ux * 5 + uy * 15);
    ctx.lineTo(uy * 5 + ux * 15, -ux * 5 + uy * 15);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawArrow() {
    if (state.screen !== 'playing') return;
    const target = state.carried ? state.house : state.package;
    if (!target) return;
    const p = state.player;
    const dx = target.x - p.x, dy = target.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 60) return;
    const a = Math.atan2(dy, dx);
    const r = 34;
    ctx.save();
    ctx.translate(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r);
    ctx.rotate(a);
    ctx.fillStyle = 'rgba(34,51,59,.55)';
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
    // 距离
    ctx.fillStyle = 'rgba(34,51,59,.55)';
    ctx.font = '10px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(Math.round(dist / 10) + ' m', p.x, p.y + 34);
  }

  function draw() {
    drawMap();
    for (const h of HOUSES) drawHouse(h, state.house === h && state.screen === 'playing');
    if (state.package) drawPackage(state.package);
    drawArrow();
    drawPlayer(state.player);

    if (state.flash > 0) {
      ctx.fillStyle = 'rgba(255,253,247,' + (state.flash * .22) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    for (const q of state.particles) {
      ctx.globalAlpha = Math.max(0, q.life / .6);
      ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(q.x, q.y, 3.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state.screen === 'intro') {
      ctx.fillStyle = 'rgba(253,246,227,.55)'; ctx.fillRect(0, 0, W, H);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 键盘
  const map = {
    ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
    ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right'
  };
  addEventListener('keydown', (e) => {
    if (map[e.code]) { keys[map[e.code]] = true; e.preventDefault(); }
    if ((e.code === 'Space' || e.code === 'Enter') && state.screen !== 'playing') {
      e.preventDefault(); start();
    }
  });
  addEventListener('keyup', (e) => {
    if (map[e.code]) { keys[map[e.code]] = false; e.preventDefault(); }
  });

  // 手机方向盘
  for (const b of document.querySelectorAll('.pad')) {
    const dir = b.dataset.dir;
    const on = (e) => { e.preventDefault(); keys[dir] = true; b.classList.add('on'); };
    const off = (e) => { e.preventDefault(); keys[dir] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('pointerleave', off);
  }

  // 按钮
  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);

  // 失焦时松开按键，避免汤姆自己跑
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; document.querySelectorAll('.pad.on').forEach(b => b.classList.remove('on')); });

  updateHud();

  // 测试与排查用只读接口
  window.TOM = {
    state,
    start,
    reset,
    get snapshot() {
      return {
        screen: state.screen, score: state.score, orders: state.orders, time: +state.time.toFixed(2),
        player: { x: +state.player.x.toFixed(1), y: +state.player.y.toFixed(1) },
        package: state.package ? { x: state.package.x, y: state.package.y } : null,
        house: state.house ? { x: state.house.x, y: state.house.y } : null,
        carried: state.carried
      };
    }
  };
})();
</script>
</body>
</html>
