<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白玉如你好 - 贪吃蛇游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: url('e6ca4381-1ac4-4b76-a92e-31f5b9f4b126.jpg') no-repeat center center;
            background-size: cover;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            padding: 20px;
            overflow: hidden;
        }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: -1;
        }
        .welcome-section { text-align: center; color: #fff; margin-bottom: 20px; }
        .welcome-section h1 {
            font-size: 3rem; font-weight: 300; letter-spacing: 0.2em;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }
        .game-container {
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; color: #fff;
        }
        .score-display { font-size: 1.2rem; font-weight: bold; }
        .score-display span { color: #4CAF50; }
        .game-canvas {
            display: block; background: #1a1a2e;
            border: 2px solid #4CAF50; border-radius: 8px;
        }
        .game-controls {
            margin-top: 15px; text-align: center;
        }
        .btn {
            background: #4CAF50; color: white; border: none;
            padding: 12px 30px; font-size: 1rem;
            border-radius: 25px; cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover { background: #45a049; transform: scale(1.05); }
        .btn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        .instructions {
            margin-top: 15px; color: #aaa; font-size: 0.9rem; text-align: center;
        }
        .instructions strong { color: #4CAF50; }
        .game-over {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 30px; border-radius: 15px;
            text-align: center; color: #fff;
            display: none; border: 2px solid #f44336;
        }
        .game-over h2 { color: #f44336; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="welcome-section">
        <h1>白玉如你好</h1>
    </div>
    <div class="game-container">
        <div class="game-header">
            <div class="score-display">得分: <span id="score">0</span></div>
        </div>
        <div style="position: relative; display: inline-block;">
            <canvas id="gameCanvas" class="game-canvas" width="400" height="400"></canvas>
            <div id="gameOver" class="game-over">
                <h2>游戏结束</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <button class="btn" onclick="startGame()" style="margin-top: 15px;">重新开始</button>
            </div>
        </div>
        <div class="game-controls">
            <button class="btn" id="startBtn" onclick="startGame()">开始游戏</button>
        </div>
        <div class="instructions">
            <p><strong>操作说明：</strong>空格键开始/暂停 | ↑ ↓ ← → 方向键控制移动</p>
            <p>吃掉水果得分，撞到墙壁或自己身体游戏结束</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        const fruits = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍑', '🍒', '🍍', '🥝', '🍉', '🥭', '🍌'];
        let currentFruit = fruits[0];
        
        let snake = [];
        let food = {};
        let dx = 0, dy = 0;
        let score = 0;
        let gameLoop = null;
        let isPaused = false;
        let isGameRunning = false;
        
        function initGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            isPaused = false;
            generateFood();
            updateScore();
        }
        
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            currentFruit = fruits[Math.floor(Math.random() * fruits.length)];
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }
        
        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#2a2a3e';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#66bb6a' : '#4caf50';
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
            
            ctx.font = '16px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(currentFruit, food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2);
        }
        
        function update() {
            if (isPaused || !isGameRunning) return;
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                generateFood();
            } else {
                snake.pop();
            }
        }
        
        function updateScore() {
            document.getElementById('score').textContent = score;
        }
        
        function gameOver() {
            isGameRunning = false;
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('startBtn').textContent = '开始游戏';
            document.getElementById('startBtn').disabled = false;
        }
        
        function startGame() {
            document.getElementById('gameOver').style.display = 'none';
            initGame();
            isGameRunning = true;
            isPaused = false;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                update();
                draw();
            }, 100);
            document.getElementById('startBtn').textContent = '游戏中';
            document.getElementById('startBtn').disabled = true;
        }
        
        function pauseGame() {
            if (!isGameRunning) return;
            isPaused = !isPaused;
        }
        
        // 键盘事件监听 - 在脚本末尾添加
        document.onkeydown = function(e) {
            // 阻止所有方向键和空格键的默认行为
            if(e.keyCode >= 37 && e.keyCode <= 40 || e.keyCode === 32) {
                e.preventDefault ? e.preventDefault() : e.returnValue = false;
            }
            
            var code = e.keyCode;
            
            // 空格键 - 开始/暂停
            if(code === 32) {
                if(!isGameRunning) startGame();
                else pauseGame();
                return false;
            }
            
            // 游戏未运行或已暂停，不响应方向键
            if(!isGameRunning || isPaused) return false;
            
            // 方向键控制 (37左, 38上, 39右, 40下)
            if(code === 38 && dy === 0) { dx = 0; dy = -1; }
            else if(code === 40 && dy === 0) { dx = 0; dy = 1; }
            else if(code === 37 && dx === 0) { dx = -1; dy = 0; }
            else if(code === 39 && dx === 0) { dx = 1; dy = 0; }
            
            return false;
        };

        // 初始绘制
        draw();
    </script>
</body>
</html>
