<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 - 白玉如你好</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        }
        .game-wrapper {
            text-align: center;
        }
        h1 {
            color: #fff;
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 0.1em;
        }
        .subtitle {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .game-container {
            display: inline-block;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
        }
        .score-board {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .score-board span {
            color: #4CAF50;
            font-weight: bold;
        }
        #gameCanvas {
            display: block;
            background: #0d0d1a;
            border: 2px solid #4CAF50;
            border-radius: 5px;
        }
        .controls {
            margin-top: 15px;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        .instructions {
            margin-top: 15px;
            color: #888;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .game-over-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #f44336;
            text-align: center;
            z-index: 100;
        }
        .game-over-modal h2 {
            color: #f44336;
            margin-bottom: 15px;
        }
        .game-over-modal p {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1>白玉如你好</h1>
        <p class="subtitle">贪吃蛇游戏</p>
        
        <div class="game-container">
            <div class="score-board">得分: <span id="score">0</span></div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div class="controls">
                <button class="btn" id="startBtn" onclick="startGame()">开始游戏</button>
            </div>
            
            <div class="instructions">
                <p><strong>操作说明：</strong>空格键开始/暂停 | ↑ ↓ ← → 方向键控制移动</p>
                <p>吃掉水果得分，撞到墙壁或自己身体游戏结束</p>
            </div>
        </div>
    </div>
    
    <div id="gameOverModal" class="game-over-modal">
        <h2>游戏结束</h2>
        <p>最终得分: <span id="finalScore">0</span></p>
        <button class="btn" onclick="startGame()">重新开始</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        const fruits = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍑', '🍒', '🍍', '🥝', '🍉', '🥭', '🍌'];
        let currentFruit = fruits[0];
        
        let snake = [];
        let food = {};
        let dx = 0, dy = 0;
        let score = 0;
        let gameLoop = null;
        let isPaused = false;
        let isGameRunning = false;
        
        function initGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            isPaused = false;
            generateFood();
            updateScore();
        }
        
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            currentFruit = fruits[Math.floor(Math.random() * fruits.length)];
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }
        
        function draw() {
            ctx.fillStyle = '#0d0d1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#66bb6a' : '#4caf50';
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
            
            ctx.font = '16px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(currentFruit, food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2);
        }
        
        function update() {
            if (isPaused || !isGameRunning) return;
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                generateFood();
            } else {
                snake.pop();
            }
        }
        
        function updateScore() {
            document.getElementById('score').textContent = score;
        }
        
        function gameOver() {
            isGameRunning = false;
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverModal').style.display = 'block';
            document.getElementById('startBtn').textContent = '开始游戏';
            document.getElementById('startBtn').disabled = false;
        }
        
        function startGame() {
            document.getElementById('gameOverModal').style.display = 'none';
            initGame();
            isGameRunning = true;
            isPaused = false;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                update();
                draw();
            }, 100);
            document.getElementById('startBtn').textContent = '游戏中';
            document.getElementById('startBtn').disabled = true;
        }
        
        function pauseGame() {
            if (!isGameRunning) return;
            isPaused = !isPaused;
        }
        
        // 键盘控制 - 使用 window 级别的 keydown
        window.onkeydown = function(e) {
            var code = e.keyCode;
            
            // 阻止方向键和空格键的默认行为
            if((code >= 37 && code <= 40) || code === 32) {
                if(e.preventDefault) e.preventDefault();
                return false;
            }
            
            return true;
        };
        
        // 使用 keypress 来捕获空格键开始游戏
        window.onkeypress = function(e) {
            var code = e.keyCode || e.which;
            
            // 空格键 (32)
            if(code === 32) {
                if(e.preventDefault) e.preventDefault();
                
                if(!isGameRunning) {
                    startGame();
                } else {
                    pauseGame();
                }
                return false;
            }
            
            return true;
        };

        // 初始绘制
        draw();
    </script>
</body>
</html>
